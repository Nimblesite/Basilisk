# Extension manifest. Implements [ZED-EXTTOML]; the placeholder version is
# stamped only during CI per [ZED-CARGOTOML] / [ZED-MIRROR].
#
# This extension states that Basilisk is unlisted and does nothing else
# ([WITHDRAWAL-SURFACES]). There is deliberately no [language_servers.*] table
# (the `basilisk` binary is inert and starts no server), no [debug_adapters.*]
# table, and no themes or grammars. The one slash command prints the statement.
id = "basilisk"
name = "Basilisk"
version = "0.0.0-PLACEHOLDER"
schema_version = 1
authors = ["Basilisk Contributors"]
description = "Basilisk's type checker produced incorrect results. Basilisk is unlisted and is being rebuilt from the ground up as a new product."
repository = "https://github.com/Nimblesite/Basilisk"

[slash_commands.basilisk]
description = "Why is Basilisk unlisted?"
requires_argument = false

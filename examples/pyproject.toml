# Folder-scoped Basilisk configuration for the examples ([CHKARCH-CONFIG-MODEL]).
#
# There is no per-path override table. Configuration is scoped by WHERE the
# file lives: `basilisk` walks up from each checked file and the nearest table
# that decides a rule wins outright. This file is that nearest table for
# everything under examples/, and the repository root's
# `pyproject.toml [tool.basilisk]` still decides every rule left undecided here
# (including the typeshed pin, which is a non-rule key and merges through).
#
# The examples model the incremental-adoption story the docs teach: PEP
# typing-spec violations stay errors, while Basilisk's opt-in strictness rules
# surface as warnings — "this type-checks, but strictness isn't at full yet".
# See website/src/docs/quick-start.md step 3.
[tool.basilisk.rules]
BSK-0001 = "warning"
BSK-0002 = "warning"
BSK-0003 = "warning"
BSK-0004 = "warning"
BSK-0005 = "warning"
BSK-0025 = "warning"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: clippy (workspace)
        run: cargo clippy --all-targets

      - name: clippy (zed extension)
        run: cargo clippy --all-targets --manifest-path basilisk-zed/Cargo.toml

      - name: Cancel workflow on lint failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            })

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      TEST_COVERAGE_BASILISK_CHECKER: ${{ vars.TEST_COVERAGE_BASILISK_CHECKER || '89' }}
      TEST_COVERAGE_BASILISK_CLI: ${{ vars.TEST_COVERAGE_BASILISK_CLI || '96' }}
      TEST_COVERAGE_BASILISK_DB: ${{ vars.TEST_COVERAGE_BASILISK_DB || '100' }}
      TEST_COVERAGE_BASILISK_LSP: ${{ vars.TEST_COVERAGE_BASILISK_LSP || '50' }}
      TEST_COVERAGE_BASILISK_MOJO: ${{ vars.TEST_COVERAGE_BASILISK_MOJO || '90' }}
      TEST_COVERAGE_BASILISK_PARSER: ${{ vars.TEST_COVERAGE_BASILISK_PARSER || '100' }}
      TEST_COVERAGE_BASILISK_PLUGIN: ${{ vars.TEST_COVERAGE_BASILISK_PLUGIN || '100' }}
      TEST_COVERAGE_BASILISK_RESOLVER: ${{ vars.TEST_COVERAGE_BASILISK_RESOLVER || '94' }}
      TEST_COVERAGE_BASILISK_STUBS: ${{ vars.TEST_COVERAGE_BASILISK_STUBS || '100' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python test dependencies
        run: pip install debugpy ruff

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run all tests
        run: ./scripts/test.sh

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/llvm-cov/html/
          retention-days: 14

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      TEST_COVERAGE_BASILISK_CHECKER: ${{ vars.TEST_COVERAGE_BASILISK_CHECKER || '89' }}
      TEST_COVERAGE_BASILISK_CLI: ${{ vars.TEST_COVERAGE_BASILISK_CLI || '96' }}
      TEST_COVERAGE_BASILISK_DB: ${{ vars.TEST_COVERAGE_BASILISK_DB || '100' }}
      TEST_COVERAGE_BASILISK_LSP: ${{ vars.TEST_COVERAGE_BASILISK_LSP || '50' }}
      TEST_COVERAGE_BASILISK_MOJO: ${{ vars.TEST_COVERAGE_BASILISK_MOJO || '90' }}
      TEST_COVERAGE_BASILISK_PARSER: ${{ vars.TEST_COVERAGE_BASILISK_PARSER || '100' }}
      TEST_COVERAGE_BASILISK_PLUGIN: ${{ vars.TEST_COVERAGE_BASILISK_PLUGIN || '100' }}
      TEST_COVERAGE_BASILISK_RESOLVER: ${{ vars.TEST_COVERAGE_BASILISK_RESOLVER || '94' }}
      TEST_COVERAGE_BASILISK_STUBS: ${{ vars.TEST_COVERAGE_BASILISK_STUBS || '100' }}
    steps:
      - uses: actions/checkout@v4

      # Rust toolchain
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      # Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install debugpy
        run: pip install debugpy

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # ── Rust ──────────────────────────────────────────────────────────
      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy --all-targets
        run: cargo clippy --all-targets

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run test.sh (tests + coverage + threshold enforcement)
        run: ./scripts/test.sh

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

      # ── LSP ───────────────────────────────────────────────────────────
      - name: Build basilisk binary
        run: cargo build -p basilisk-cli

      - name: Run LSP integration tests
        run: ./scripts/test-lsp.sh

      # ── VS Code extension ─────────────────────────────────────────────
      - name: Install extension dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: Compile extension
        run: npm run compile
        working-directory: vscode-extension

      - name: Check for TypeScript errors
        run: npx tsc --noEmit
        working-directory: vscode-extension

      # ── VS Code E2E + Debugger ────────────────────────────────────────
      - name: Run VS Code E2E tests
        run: xvfb-run -a npm test
        working-directory: vscode-extension
        timeout-minutes: 10
        env:
          DISPLAY: ":99"
          BASILISK_EXECUTABLE_PATH: ${{ github.workspace }}/target/debug/basilisk
          MOCHA_TIMEOUT: "120000"

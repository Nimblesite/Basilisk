name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Lint (runs in parallel with all test jobs) ─────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lld and ruff
        run: |
          sudo apt-get update && sudo apt-get install -y lld
          pip install ruff

      - name: Format check (Rust + Python)
        run: make fmt-check

      - name: clippy (workspace)
        run: cargo clippy --release --all-targets

      - name: clippy (zed extension)
        run: cargo clippy --release --all-targets --manifest-path basilisk-zed/Cargo.toml

  # ── Zed Extension (runs in parallel) ───────────────────────────────────────
  zed:
    name: Zed Extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build Zed extension to WASM
        run: cargo build --release --target wasm32-wasip2 --manifest-path basilisk-zed/Cargo.toml

      - name: Clippy (Zed extension)
        run: cargo clippy --release --all-targets --manifest-path basilisk-zed/Cargo.toml

      - name: Run Zed extension unit tests
        run: cargo test --release --manifest-path basilisk-zed/Cargo.toml

  # ── Rust coverage + thresholds (runs in parallel) ──────────────────────────
  test-rust:
    name: Rust Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_COVERAGE_BASILISK_CHECKER: ${{ vars.TEST_COVERAGE_BASILISK_CHECKER || '92' }}
      TEST_COVERAGE_BASILISK_CLI: ${{ vars.TEST_COVERAGE_BASILISK_CLI || '94' }}
      TEST_COVERAGE_BASILISK_DB: ${{ vars.TEST_COVERAGE_BASILISK_DB || '100' }}
      TEST_COVERAGE_BASILISK_LSP: ${{ vars.TEST_COVERAGE_BASILISK_LSP || '74' }}
      TEST_COVERAGE_BASILISK_MOJO: ${{ vars.TEST_COVERAGE_BASILISK_MOJO || '91' }}
      TEST_COVERAGE_BASILISK_PARSER: ${{ vars.TEST_COVERAGE_BASILISK_PARSER || '100' }}
      TEST_COVERAGE_BASILISK_PLUGIN: ${{ vars.TEST_COVERAGE_BASILISK_PLUGIN || '100' }}
      TEST_COVERAGE_BASILISK_RESOLVER: ${{ vars.TEST_COVERAGE_BASILISK_RESOLVER || '95' }}
      TEST_COVERAGE_BASILISK_STUBS: ${{ vars.TEST_COVERAGE_BASILISK_STUBS || '100' }}
      TEST_COVERAGE_BASILISK_CONFIG: ${{ vars.TEST_COVERAGE_BASILISK_CONFIG || '92' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: pip install debugpy ruff

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run Rust tests with coverage
        run: ./scripts/test-rust.sh

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/llvm-cov/html/
          retention-days: 14

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ── VS Code extension (runs in parallel) ───────────────────────────────────
  test-vscode:
    name: VS Code Extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_COVERAGE_VSIX: ${{ vars.TEST_COVERAGE_VSIX || '60' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: pip install debugpy ruff

      - name: Install lld, xvfb, and VS Code test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            lld \
            xvfb \
            libnspr4 \
            libnss3 \
            libgbm1 \
            libxkbfile1 \
            libsecret-1-0 \
            libgtk-3-0 \
            libxss1 \
            libxtst6 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libgdk-pixbuf2.0-0 \
            libdbus-1-3
          # libasound2 was renamed to libasound2t64 on Ubuntu 24.04+
          sudo apt-get install -y libasound2 2>/dev/null || sudo apt-get install -y libasound2t64

      - name: Run VS Code extension tests
        run: ./scripts/test-vscode.sh

  # ── Neovim extension (runs in parallel) ────────────────────────────────────
  test-nvim:
    name: Neovim Extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_COVERAGE_NVIM: ${{ vars.TEST_COVERAGE_NVIM || '30' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest and luarocks
        run: |
          pip install pytest
          sudo apt-get install -y luarocks
          luarocks install --local luacov

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.11.6

      - name: Run Neovim extension tests
        run: |
          eval "$(luarocks path)"
          export PATH="$HOME/.luarocks/bin:$PATH"
          ./scripts/test-nvim.sh

  # ── Test gate (standard job name per repo standards) ───────────────────────
  test:
    name: All Tests
    needs: [test-rust, test-vscode, test-nvim, zed]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.test-rust.result }}" != "success" ]] || \
             [[ "${{ needs.test-vscode.result }}" != "success" ]] || \
             [[ "${{ needs.test-nvim.result }}" != "success" ]] || \
             [[ "${{ needs.zed.result }}" != "success" ]]; then
            echo "One or more test jobs failed"
            exit 1
          fi
          echo "All test jobs passed"

  # ── Build gate (standard job name per repo standards) ──────────────────────
  build:
    name: Build
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Build Rust (release)
        run: cargo build --release

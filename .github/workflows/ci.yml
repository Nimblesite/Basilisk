# agent-pmo:2efd847
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Lint (runs in parallel with all test jobs) ─────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lld and ruff
        run: |
          sudo apt-get update && sudo apt-get install -y lld
          pip install ruff

      - name: Format check (Rust + Python)
        run: |
          cargo fmt --all -- --check
          ruff format --check --exclude '*/fixtures/*' .

      - name: Lint (clippy + eslint)
        run: make lint

  # ── Zed Extension (runs in parallel) ───────────────────────────────────────
  zed:
    name: Zed Extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build Zed extension to WASM
        run: cargo build --release --target wasm32-wasip2 --manifest-path basilisk-zed/Cargo.toml

      - name: Clippy (Zed extension)
        run: cargo clippy --release --all-targets --manifest-path basilisk-zed/Cargo.toml

      - name: Run Zed extension unit tests
        run: cargo test --release --manifest-path basilisk-zed/Cargo.toml

  # ── Rust coverage + thresholds (runs in parallel) ──────────────────────────
  test-rust:
    name: Rust Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: pip install debugpy ruff

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run Rust tests with coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/test-rust.sh

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/llvm-cov/html/
          retention-days: 14

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ── VS Code extension (runs in parallel) ───────────────────────────────────
  test-vscode:
    name: VS Code Extension
    runs-on: ubuntu-latest
    # TIMEOUT EXCEPTION: VS Code extension e2e tests launch a full VS Code instance via xvfb, requiring ~25 min
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: pip install debugpy ruff

      - name: Install lld, xvfb, and VS Code test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            lld \
            xvfb \
            libnspr4 \
            libnss3 \
            libgbm1 \
            libxkbfile1 \
            libsecret-1-0 \
            libgtk-3-0 \
            libxss1 \
            libxtst6 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libgdk-pixbuf2.0-0 \
            libdbus-1-3
          # libasound2 was renamed to libasound2t64 on Ubuntu 24.04+
          sudo apt-get install -y libasound2 2>/dev/null || sudo apt-get install -y libasound2t64

      - name: Run VS Code extension tests
        run: make _test_vsix

  verify-binaries:
    name: Shipwright Binary Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Build Shipwright binaries
        run: cargo build --release --bin basilisk --bin basilisk-profiler-helper

      - name: Install VSIX verifier dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Verify manifest and binary version contracts
        working-directory: vscode-extension
        run: |
          npm run test:shipwright
          node scripts/verify-shipwright.mjs versions \
            ../target/release/basilisk \
            ../target/release/basilisk-profiler-helper

  verify-extension-package:
    name: Shipwright VSIX Gate - ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
            rust_target: aarch64-apple-darwin
            npm_config_arch: arm64
          - os: macos-13
            platform: darwin
            arch: x64
            rust_target: x86_64-apple-darwin
            npm_config_arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            npm_config_arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            npm_config_arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            npm_config_arch: x64
          - os: windows-latest
            platform: win32
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
            npm_config_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install cross-compilation tools
        if: matrix.rust_target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: shipwright-vsix-${{ matrix.rust_target }}
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install VSIX dependencies
        working-directory: vscode-extension
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_config_arch }}

      - name: Validate Shipwright manifest
        working-directory: vscode-extension
        run: npm run test:shipwright

      - name: Build VSIX runtime binaries
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.rust_target }} --bin basilisk
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            cargo build --release --target ${{ matrix.rust_target }} --bin basilisk-profiler-helper
          fi

      - name: Set vsce target
        shell: pwsh
        run: echo "target=${{ matrix.platform }}-${{ matrix.arch }}" >> $env:GITHUB_ENV

      - name: Stage Shipwright manifest and runtime binaries
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ matrix.platform }}" = "win32" ]; then exe=".exe"; fi
          rm -rf vscode-extension/bin
          mkdir -p "vscode-extension/bin/${{ env.target }}"
          cp "target/${{ matrix.rust_target }}/release/basilisk${exe}" "vscode-extension/bin/${{ env.target }}/"
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            cp "target/${{ matrix.rust_target }}/release/basilisk-profiler-helper" "vscode-extension/bin/${{ env.target }}/"
          fi
          cp shipwright.json vscode-extension/shipwright.json

      - name: Package and verify VSIX
        working-directory: vscode-extension
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ matrix.platform }}" = "win32" ]; then exe=".exe"; fi
          npx vsce package --target "${{ env.target }}" --ignore-other-target-folders --out "basilisk-${{ env.target }}.vsix"
          unzip -l "basilisk-${{ env.target }}.vsix" | grep -F "bin/${{ env.target }}/basilisk${exe}"
          unzip -l "basilisk-${{ env.target }}.vsix" | grep -F "shipwright.json"
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            unzip -l "basilisk-${{ env.target }}.vsix" | grep -F "bin/${{ env.target }}/basilisk-profiler-helper"
          fi
          node scripts/verify-shipwright.mjs vsix "basilisk-${{ env.target }}.vsix" "${{ env.target }}"

  # ── Neovim extension (runs in parallel) ────────────────────────────────────
  test-nvim:
    name: Neovim Extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest and luarocks
        run: |
          pip install pytest
          sudo apt-get install -y luarocks
          luarocks install --local luacov

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.11.6

      - name: Run Neovim extension tests
        run: |
          eval "$(luarocks path)"
          export PATH="$HOME/.luarocks/bin:$PATH"
          ./scripts/test-nvim.sh

  # ── Mutation testing (runs in parallel shards) ─────────────────────────────
  mutation-test-shard:
    name: Mutation Testing Shard ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "0/4"
            label: 1-of-4
            output: 0-of-4
          - shard: "1/4"
            label: 2-of-4
            output: 1-of-4
          - shard: "2/4"
            label: 3-of-4
            output: 2-of-4
          - shard: "3/4"
            label: 4-of-4
            output: 3-of-4
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Run mutation test shard
        run: make mutation-test SHARD="${{ matrix.shard }}" MUTATION_CHECK=0

      - name: Upload mutation shard output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-output-${{ matrix.label }}
          path: mutation_testing/mutants.out.working-shard-${{ matrix.output }}/mutants.out/
          retention-days: 14

  mutation-test:
    name: Mutation Testing
    runs-on: ubuntu-latest
    needs: mutation-test-shard
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download mutation shard outputs
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-output-*
          path: mutation_testing/shards

      - name: Merge mutation shards and check baseline
        run: |
          python3 scripts/mutation_merge_outcomes.py \
            mutation_testing/shards/mutation-output-*/outcomes.json \
            --output mutation_testing/mutants.out.working/mutants.out/outcomes.json
          python3 mutation_testing/mutants_report.py \
            mutation_testing/mutants.out.working/mutants.out/outcomes.json \
            mutation_testing/mutants_report.html \
            --scores mutation_testing/mutation_scores.json \
            --scope working

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            mutation_testing/mutants_report.html
            mutation_testing/mutants.out.working/mutants.out/
          retention-days: 14

  # ── Build gate (standard job name per repo standards) ──────────────────────
  build:
    name: Build
    needs: [test-rust, test-vscode, test-nvim, zed, mutation-test, verify-binaries, verify-extension-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Build Rust (release)
        run: cargo build --release

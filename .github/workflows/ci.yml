# agent-pmo:0b21609

# ⚠️ NEVER STORE CI ARTIFACTS — they cost money even on this PUBLIC repo (compute on standard runners is free; **storage is billed**). 
# The ONLY artifacts we keep are the **GitHub Releases** (Release assets are free + unlimited). NO `actions/upload-artifact` for coverage HTML, mutation reports, logs, screenshots, or any diagnostic. 
# The sole permitted upload is a transient in-run cross-job hand-off, and it MUST set `retention-days: 1` (the floor) so it is consumed and deleted within the same run. 
# Set retention to 1 day wherever you see a deviation. See [GITHUB-NO-ARTIFACTS]. ⚠️

name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Least-privilege default ([SWR-SEC-TOKEN-PRIVILEGE]). CI only reads the repo;
# any job needing more must opt in with a job-scoped permissions block.
permissions:
  contents: read

jobs:
  # ── Change-scope gate ──────────────────────────────────────────────────────
  # Website + benchmark assets are static-site data that deploy via
  # deploy-pages.yml and never enter the Rust toolchain. A PR touching ONLY them
  # has no reason to run the (long, expensive) Rust/extension/mutation matrix, so
  # this job classifies the diff and every heavy job below gates on `code`. A job
  # skipped via `if:` reports as success, so required status checks stay green on
  # a docs-only PR. Website-only PRs instead get the fast `website` build check.
  changes:
    name: Detect change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      website: ${{ steps.classify.outputs.website }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          ACTOR: ${{ github.actor }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Dependabot PRs are swept into `dependabot-upgrades` by
          # dependabot-automerge.yml and never merge into main directly, so the
          # heavy matrix would only burn minutes on a bump we discard. CI runs
          # once, on the consolidation PR. ([GITHUB-DEPENDABOT])
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "code=false"    >> "$GITHUB_OUTPUT"
            echo "website=false" >> "$GITHUB_OUTPUT"
            echo "Dependabot PR — skipping Rust/extension matrix and website build."
            exit 0
          fi
          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          changed="$(git diff --name-only "$base" "$HEAD_SHA")"
          echo "Changed files:"; printf '%s\n' "$changed"
          code=false
          website=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # `website` gates the site build: only files the published site is
            # actually built from (templates/assets + the benchmark CSVs it reads).
            case "$f" in
              # The site build, plus the checker rule sources the diagnostic
              # data (website/src/_data/rules.json) and /errors/ pages are
              # generated from — so a new/renamed rule re-runs the drift guard.
              website/*|benchmarks/status/*|crates/basilisk-checker/src/rules/*) website=true ;;
            esac
            # `code` gates the heavy Rust/extension/mutation matrix. Everything
            # that never reaches the Rust toolchain is excluded: the whole site,
            # ALL benchmark tooling (run.sh, fixtures, CSVs), docs/markdown, and
            # CI/workflow YAML itself (changing orchestration doesn't change Rust
            # — the edited workflow already runs on this very PR). Touch anything
            # else (crates, Cargo.*, scripts, extensions) and the matrix runs.
            case "$f" in
              website/*|benchmarks/*|docs/*|.github/*|*.md) ;;
              *) code=true ;;
            esac
          done <<< "$changed"
          # An empty diff (e.g. re-run on a merged ref) defaults to full CI.
          [ -z "$changed" ] && code=true
          echo "code=$code"       >> "$GITHUB_OUTPUT"
          echo "website=$website" >> "$GITHUB_OUTPUT"
          echo "Run Rust/extension matrix (code): $code"
          echo "Run website build check (website): $website"

  # ── Website build check (only when site/benchmark files change) ─────────────
  # Mirrors deploy-pages.yml's build so a broken template/data file is caught
  # BEFORE merge instead of silently failing the post-merge deploy.
  website:
    name: Website Build
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 — mirrors deploy-pages.yml so the conformance over-time
      # chart (built from the git history of conformance_status.csv) is exercised
      # by the pre-merge build check, not just the post-merge deploy.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      # The /errors/ pages and the rules reference are generated from the checker
      # source ([WEBSITE-ERROR-PAGES]); fail if the committed data is stale so the
      # pages the CLI deep-links to can never drift from the diagnostics it emits.
      - name: Check generated diagnostic data is in sync with the checker
        run: |
          python3 scripts/gen_rules_reference.py --data /tmp/rules.json
          diff -u website/src/_data/rules.json /tmp/rules.json \
            || { echo "::error::rules.json is stale — run: python3 scripts/gen_rules_reference.py --data"; exit 1; }

      - name: Build site
        working-directory: website
        # GITHUB_TOKEN raises the GitHub API rate limit for _data/releases.js
        # (the releases page is generated from the live Releases API at build
        # time); the build still degrades gracefully if the call fails.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      # Navigation smoke tests ([WEBSITE-E2E-SMOKE]) and CLI-screenshot render
      # checks ([WEBSITE-SCREENSHOTS-VERIFY]). Both presets (Desktop Chrome +
      # Pixel 5) run on Chromium, so only chromium is installed. The screenshots
      # are committed, regenerated locally with `npm run screenshots` against the
      # real binary — CI only verifies they render, it never captures them.
      - name: Install Playwright browser
        working-directory: website
        run: npx playwright install --with-deps chromium

      - name: Run navigation + screenshot smoke tests (desktop + mobile)
        working-directory: website
        # CI uses the stdout `list` reporter only — no HTML report, trace,
        # video or screenshot is produced or uploaded ([GITHUB-NO-ARTIFACTS]).
        run: npm run test:e2e

  # ── Lint (runs in parallel with all test jobs) ─────────────────────────────
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install lld and ruff
        run: |
          sudo apt-get update && sudo apt-get install -y lld
          pip install ruff==0.15.17

      - name: Format check (Rust + Python)
        run: |
          cargo fmt --all -- --check
          ruff format --check --exclude '*/fixtures/*' .

      # Install the deslop duplication-gate CLI BEFORE `make lint` runs it
      # ([CI-DESLOP]). The pinned version + platform asset mapping live in
      # scripts/install-deslop.sh (single source of truth, shared with
      # scripts/setup.sh); it verifies the SHA-256 and appends the install dir
      # to $GITHUB_PATH so the next step sees the binary.
      - name: Install deslop
        run: scripts/install-deslop.sh "$HOME/.local/bin"

      # `make lint` runs clippy, eslint, AND the deslop duplication gate. The
      # threshold lives in committed .deslop.toml — ratcheted DOWN only, never
      # up — and deslop exits non-zero when repo-wide duplication exceeds it.
      - name: Lint (clippy + eslint + deslop)
        run: make lint

  # ── Zed Extension (runs in parallel) ───────────────────────────────────────
  zed:
    name: Zed Extension
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          # Bust the cache: a prior run cached host build-script binaries
          # (e.g. serde's build-script-build) linked against a glibc the
          # standard runner does not provide, so they failed to execute on
          # restore. A fresh prefix forces serde et al. to rebuild from
          # source against the runner's own glibc.
          prefix-key: v1-rust-glibc

      - name: Build Zed extension to WASM
        run: cargo build --release --target wasm32-wasip2 --manifest-path basilisk-zed/Cargo.toml

      - name: Clippy (Zed extension)
        run: cargo clippy --release --all-targets --manifest-path basilisk-zed/Cargo.toml

      - name: Run Zed extension unit tests
        run: cargo test --release --manifest-path basilisk-zed/Cargo.toml

  # ── Rust coverage + thresholds (runs in parallel) ──────────────────────────
  test-rust:
    name: Rust Tests & Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # llvm-cov instruments and compiles the whole workspace before running every
    # target — CPU-bound, so it rides BIG_RUNNER too (see the mutation job for
    # the opt-in contract). Falls back to the standard runner when unset.
    runs-on: ${{ vars.BIG_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: pip install debugpy==1.8.14 ruff==0.15.17

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@81ee9698f20724138a785d788c7567d40f14cd2d # cargo-llvm-cov

      # Only the conformance FIXTURES are fetched (the calculator
      # conformance/upstream_main.py is committed). Cache the downloaded fixtures
      # keyed on score.py, which holds the pinned ref (PINNED_TYPING_REF) — bumping
      # the ref edits that file and busts the cache; score.py re-fetches whenever
      # the stamped ref differs, so a stale prefix restore self-heals.
      - name: Cache conformance fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: conformance/tests
          key: conformance-suite-${{ hashFiles('conformance/score.py') }}
          restore-keys: conformance-suite-

      - name: Run Rust tests with coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/test-rust.sh

      # No artifact upload of the HTML coverage report ([GITHUB-NO-ARTIFACTS]).
      # Coverage is enforced in-job (test-rust.sh fails below threshold) and
      # published to Codecov below; the HTML is reproducible locally via
      # `make test`, so storing it would just bill GB-days for nothing.
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ── VS Code extension (runs in parallel) ───────────────────────────────────
  test-vscode:
    name: VS Code Extension
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # TIMEOUT EXCEPTION: VS Code extension e2e tests launch a full VS Code instance via xvfb, requiring ~25 min
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: pip install debugpy==1.8.14 ruff==0.15.17

      - name: Install lld, xvfb, and VS Code test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            lld \
            xvfb \
            libnspr4 \
            libnss3 \
            libgbm1 \
            libxkbfile1 \
            libsecret-1-0 \
            libgtk-3-0 \
            libxss1 \
            libxtst6 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libgdk-pixbuf2.0-0 \
            libdbus-1-3
          # libasound2 was renamed to libasound2t64 on Ubuntu 24.04+
          sudo apt-get install -y libasound2 2>/dev/null || sudo apt-get install -y libasound2t64

      # @vscode/test-electron downloads a full VS Code build (~150 MB) into
      # .vscode-test on every run. Cache it keyed on the test config + manifest
      # so the pinned editor version is reused instead of re-downloaded; a
      # version bump (config/manifest change) busts the key and re-fetches.
      - name: Cache VS Code test build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vscode-extension/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('vscode-extension/.vscode-test.mjs', 'vscode-extension/.vscode-test.js', 'vscode-extension/package.json') }}
          restore-keys: vscode-test-${{ runner.os }}-

      - name: Run VS Code extension tests
        run: make _test_vsix

  verify-binaries:
    name: Shipwright Binary Gate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # Share one release-profile cache scope with the `build` gate below: both
      # jobs run `cargo build --release`, so they compile the identical external
      # dependency graph. A single shared scope (instead of two per-job scopes)
      # halves this pair's cache footprint — relieving the 10 GB repo-cache limit
      # that was evicting warm caches — and lets `build` (which runs later, after
      # the test jobs) restore the dependencies this job already compiled.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          shared-key: release

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Build Shipwright binaries
        run: cargo build --release --bin basilisk --bin basilisk-profiler-helper

      - name: Install VSIX verifier dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Verify manifest and binary version contracts
        working-directory: vscode-extension
        run: |
          npm run test:shipwright
          node scripts/verify-shipwright.mjs versions \
            ../target/release/basilisk \
            ../target/release/basilisk-profiler-helper

  # ── Neovim extension (runs in parallel) ────────────────────────────────────
  test-nvim:
    name: Neovim Extension
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install pytest and luarocks
        run: |
          pip install pytest==9.1.1
          sudo apt-get install -y luarocks
          luarocks install --local luacov

      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: v0.11.6

      # The nvim e2e harness git-clones plenary/dap/mini into /tmp on every run.
      # Cache them so the clones become no-ops — test-nvim.sh skips any dir that
      # already exists. Bump the key suffix to force a refresh of the pins.
      - name: Cache Neovim test plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/plenary.nvim
            /tmp/nvim-dap
            /tmp/mini.nvim
          key: nvim-test-plugins-${{ runner.os }}-v1

      - name: Run Neovim extension tests
        run: |
          eval "$(luarocks path)"
          export PATH="$HOME/.luarocks/bin:$PATH"
          ./scripts/test-nvim.sh

  # ── Mutation testing (runs in parallel shards) ─────────────────────────────
  mutation-test-shard:
    name: Mutation Testing Shard ${{ matrix.label }}
    needs: changes
    # NOTE: no job-level `if`. Each of the four shards is a REQUIRED status check
    # by its expanded name ("Mutation Testing Shard 1-of-4" …). A job-level skip
    # collapses the matrix to the literal, unexpanded "… ${{ matrix.label }}", so
    # the four required contexts never report and branch protection blocks the PR
    # forever. Instead the matrix always expands and every step is gated on
    # `code`: when a PR is site/docs/config-only the steps no-op and each shard
    # reports success in seconds, satisfying the required checks at ~zero cost.
    env:
      RUN: ${{ needs.changes.outputs.code }}
    # Big-runner opt-in via a single org/repo Actions variable. Set BIG_RUNNER to
    # the label of the Nimblesite GitHub-hosted larger runner to route the real,
    # CPU-bound mutation work onto it; leave it unset and the job falls back to
    # the standard hosted runner so CI never breaks on a missing label. The
    # variable is the single source of truth — change the machine in one place.
    #
    # The `code` guard keeps the larger runner off no-op shards: this job has no
    # job-level `if` (the four shards must always report as required checks), so
    # on a docs/config-only PR every shard still starts but every step no-ops.
    # Only bill BIG_RUNNER when there is actually Rust to mutate; otherwise these
    # seconds-long no-ops run on the standard runner.
    runs-on: ${{ (needs.changes.outputs.code == 'true' && vars.BIG_RUNNER) || 'ubuntu-24.04' }}
    # cargo-mutants rebuilds + reruns the test suite once per mutant, so it is
    # heavily CPU-bound — the primary reason BIG_RUNNER exists. The 20-minute
    # budget was calibrated for an 8-core larger runner; the standard hosted
    # runner's slower shards tip over it non-deterministically, so 60 min gives
    # ~3x headroom on the fallback path without weakening the mutation gate (the
    # merge job still enforces score). On BIG_RUNNER the shards finish well
    # under it; the ceiling is harmless.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "0/4"
            label: 1-of-4
            output: 0-of-4
          - shard: "1/4"
            label: 2-of-4
            output: 1-of-4
          - shard: "2/4"
            label: 3-of-4
            output: 2-of-4
          - shard: "3/4"
            label: 4-of-4
            output: 3-of-4
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          # All four shards share one cache scope (identical job name + flags),
          # so only the first needs to upload the ~290 MB cache. The other three
          # restore it but skip the redundant save race (last-writer churn).
          save-if: ${{ env.RUN == 'true' && matrix.shard == '0/4' }}

      - if: env.RUN == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install lld
        if: env.RUN == 'true'
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Install cargo-mutants
        if: env.RUN == 'true'
        uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad # v2
        with:
          tool: cargo-mutants

      - name: Run mutation test shard
        if: env.RUN == 'true'
        run: make mutation-test SHARD="${{ matrix.shard }}" MUTATION_CHECK=0

      # The ONLY artifact CI is allowed to create ([GITHUB-NO-ARTIFACTS]): a
      # transient in-run hand-off so the `mutation-test` job below can merge the
      # four shards' outcomes and enforce the score gate. retention-days: 1 is
      # the floor — it is consumed and auto-deleted within the same run, so it
      # never accrues stored GB-days. It is NOT a retained build output.
      - name: Upload mutation shard output
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-output-${{ matrix.label }}
          path: mutation_testing/mutants.out.working-shard-${{ matrix.output }}/mutants.out/
          retention-days: 1

  mutation-test:
    name: Mutation Testing
    runs-on: ubuntu-24.04
    needs: [changes, mutation-test-shard]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Download mutation shard outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-output-*
          path: mutation_testing/shards

      - name: Merge mutation shards and check baseline
        run: |
          python3 scripts/mutation_merge_outcomes.py \
            mutation_testing/shards/mutation-output-*/outcomes.json \
            --output mutation_testing/mutants.out.working/mutants.out/outcomes.json
          python3 mutation_testing/mutants_report.py \
            mutation_testing/mutants.out.working/mutants.out/outcomes.json \
            mutation_testing/mutants_report.html \
            --scores mutation_testing/mutation_scores.json \
            --scope working
          # The merge step ABOVE is the gate: it fails the job if the mutation
          # score regresses against the committed baseline. The HTML report is
          # not uploaded as an artifact ([GITHUB-NO-ARTIFACTS]) — it is
          # reproducible locally via `make mutation-test`.

  # ── Build gate (standard job name per repo standards) ──────────────────────
  build:
    name: Build
    needs: [changes, test-rust, test-vscode, test-nvim, zed, mutation-test, verify-binaries]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # Reuse the release-profile dependency cache that `verify-binaries`
      # populated earlier in this run (shared scope, same Cargo build). save-if
      # is false because that job already owns the save — this gate only needs to
      # restore so its `cargo build --release` is a warm, near-no-op compile.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          shared-key: release
          save-if: false

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Build Rust (release)
        run: cargo build --release

  # ── Dependency review ([GITHUB-DEP-REVIEW]) ────────────────────────────────
  # Blocks PRs that introduce dependencies with known-high vulnerabilities. This
  # is the repo's ONLY dependency vuln-gate — there is no cargo-deny/osv gate, so
  # there is no doubling-up. It is SEPARATE from CodeQL (codeql.yml = vulnerable
  # code) and `make lint` (style/correctness): one owner per concern. PR-only by
  # construction — dependency-review diffs base vs head — which matches this
  # workflow's pull_request-only trigger.
  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # dependency-review posts its PR summary
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

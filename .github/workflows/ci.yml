# agent-pmo:0b21609

# ⚠️ NEVER STORE CI ARTIFACTS — they cost money even on this PUBLIC repo (compute on standard runners is free; **storage is billed**). 
# The ONLY artifacts we keep are the **GitHub Releases** (Release assets are free + unlimited). NO `actions/upload-artifact` for coverage HTML, mutation reports, logs, screenshots, or any diagnostic. 
# The sole permitted upload is a transient in-run cross-job hand-off, and it MUST set `retention-days: 1` (the floor) so it is consumed and deleted within the same run. 
# Set retention to 1 day wherever you see a deviation. See [GITHUB-NO-ARTIFACTS]. ⚠️

name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # lld is carried HERE, not in .cargo/config.toml, because cargo's four
  # extra-flag sources are mutually exclusive and first-match-wins
  # (CARGO_ENCODED_RUSTFLAGS > RUSTFLAGS > target.<triple>.rustflags >
  # build.rustflags). A non-empty RUSTFLAGS therefore DISCARDS the whole
  # `[target.x86_64-unknown-linux-gnu]` block in .cargo/config.toml — which is
  # why every job below apt-installed lld and then silently linked with bfd
  # anyway. Verified empirically: with RUSTFLAGS unset the config flag reaches
  # rustc; with RUSTFLAGS set it reaches it zero times.
  #
  # Two jobs override this per-job because they link something that is not
  # x86_64 linux and would reject `-fuse-ld=lld`: `zed` (wasm32-wasip2) and
  # `test-vscode-windows` (MSVC link.exe). Job-level
  # `env` merges per-key, so every other job inherits both flags automatically.
  RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=lld"

# Least-privilege default ([SWR-SEC-TOKEN-PRIVILEGE]). CI only reads the repo;
# any job needing more must opt in with a job-scoped permissions block.
permissions:
  contents: read

jobs:
  # ── Change-scope gate ──────────────────────────────────────────────────────
  # Classify the diff and run ONLY the jobs whose inputs actually changed. A job
  # skipped via `if:` reports as success, so required status checks stay green
  # whatever the scope. The flags:
  #   core    — the Rust the `basilisk` binary is built from (crates, Cargo.*,
  #             conformance, scripts, root configs). Runs the full Rust matrix
  #             AND all three editor extensions, because each one executes that
  #             binary, so a checker/LSP change can change their behaviour.
  #   vscode  — vscode-extension/** only → the VS Code job (+ shipwright gate).
  #   nvim    — basilisk.nvim/** only → the Neovim job.
  #   zed     — basilisk-zed/** only → the Zed job.
  #   website — static-site sources → the site build check. ONLY a release
  #             publishes the site (deploy-pages.yml has no push trigger), so
  #             this pre-merge build is the only gate before it: a break caught
  #             here instead of at release time, where it blocks shipping.
  #   code    — union of core|vscode|nvim|zed, for whole-repo jobs (lint/deslop).
  # A PR touching ONLY docs/website/CI-YAML starts no code job at all.
  changes:
    name: Detect change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      core: ${{ steps.classify.outputs.core }}
      vscode: ${{ steps.classify.outputs.vscode }}
      nvim: ${{ steps.classify.outputs.nvim }}
      zed: ${{ steps.classify.outputs.zed }}
      code: ${{ steps.classify.outputs.code }}
      website: ${{ steps.classify.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          ACTOR: ${{ github.actor }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          # ── `docs-only` label: explicit, per-PR opt-out ────────────────────
          # A human adds this label when a PR carries nothing the code matrix
          # would meaningfully exercise. It is deliberately a LABEL and not a
          # path rule: the decision is visible on the PR, attributable to the
          # person who made it, and removed by removing the label. No PR without
          # it is affected, so no gate is weakened for anybody else.
          # NOT for a PR that changes checker behaviour — a green tick here means
          # "nobody looked", and the deletion work ahead needs the matrix to run.
          case ",$LABELS," in
            *,docs-only,*)
              {
                echo "core=false"
                echo "vscode=false"
                echo "nvim=false"
                echo "zed=false"
                echo "code=false"
                echo "website=false"
              } >> "$GITHUB_OUTPUT"
              echo "docs-only label present — skipping every code and website job."
              exit 0
              ;;
          esac
          # Dependabot PRs are swept into `dependabot-upgrades` by
          # dependabot-automerge.yml and never merge into main directly, so the
          # heavy matrix would only burn minutes on a bump we discard. CI runs
          # once, on the consolidation PR. ([GITHUB-DEPENDABOT])
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            {
              echo "core=false"
              echo "vscode=false"
              echo "nvim=false"
              echo "zed=false"
              echo "code=false"
              echo "website=false"
            } >> "$GITHUB_OUTPUT"
            echo "Dependabot PR — skipping Rust/extension matrix and website build."
            exit 0
          fi
          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          changed="$(git diff --name-only "$base" "$HEAD_SHA")"
          echo "Changed files:"; printf '%s\n' "$changed"
          core=false
          vscode=false
          nvim=false
          zed=false
          website=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # `website` gates the site build: only files the published site is
            # actually built from (templates/assets + the benchmark CSVs it reads).
            case "$f" in
              # The site build, plus the messaging spec its every published word
              # is extracted from ([WITHDRAWAL-COPY]) — so editing the spec
              # re-runs the drift guard and the site build.
              website/*|docs/specs/DOCS-WITHDRAWAL-MESSAGING-SPEC.md) website=true ;;
              # The generators themselves: a change to either one can move the
              # published words without touching the spec or a template.
              scripts/gen_withdrawal_copy.py|scripts/gen_readmes.py) website=true ;;
              scripts/test_published_readmes.py) website=true ;;
              # The public-copy scan and its own tests ([WITHDRAWAL-SURFACES]).
              scripts/check_public_copy.py) website=true ;;
              scripts/test_check_public_copy.py) website=true ;;
              # Every other surface the scan reads: a marketing sentence in any
              # of them contradicts the statement just as loudly as one in a
              # README, so a change to one must re-run the scan.
              CONTRIBUTING.md|SECURITY.md|pyproject.toml) website=true ;;
              crates/*/README.md|book/README.md|delist/README.md) website=true ;;
              vscode-extension/package.json|basilisk-zed/extension.toml) website=true ;;
              basilisk.nvim/doc/*) website=true ;;
              .github/release-templates/*) website=true ;;
              # The published READMEs are generated from docs/readme/ ([README]),
              # so touching a source OR a generated copy re-runs that guard too.
              docs/readme/*) website=true ;;
              README.md|README-pypi.md) website=true ;;
              vscode-extension/README.md) website=true ;;
              basilisk-zed/README.md|basilisk.nvim/README.md) website=true ;;
            esac
            # Route each changed path to the NARROWEST code scope that needs it.
            # Pure docs / static site / benchmark tooling / CI YAML never reach a
            # code toolchain and start no code job (changing orchestration does
            # not change Rust — the edited workflow already runs on this very PR).
            # Each editor-extension tree triggers ONLY its own job. Everything
            # else — crates, Cargo.*, conformance, scripts, root configs — is the
            # core Rust the `basilisk` binary is built from; it re-runs the whole
            # Rust matrix AND all three editor extensions, because each one
            # executes that binary and a checker/LSP change alters its behaviour.
            case "$f" in
              website/*|benchmarks/*|docs/*|.github/*|*.md) ;;
              vscode-extension/*) vscode=true ;;
              basilisk.nvim/*)    nvim=true ;;
              basilisk-zed/*)     zed=true ;;
              *)                  core=true ;;
            esac
          done <<< "$changed"
          # An empty diff (e.g. re-run on a merged ref) defaults to full CI.
          [ -z "$changed" ] && core=true
          # `code` is the union for whole-repo jobs (lint runs clippy + eslint +
          # the repo-wide deslop gate, so any code change must run it).
          code=false
          if [ "$core" = true ] || [ "$vscode" = true ] || \
             [ "$nvim" = true ] || [ "$zed" = true ]; then
            code=true
          fi
          {
            echo "core=$core"
            echo "vscode=$vscode"
            echo "nvim=$nvim"
            echo "zed=$zed"
            echo "code=$code"
            echo "website=$website"
          } >> "$GITHUB_OUTPUT"
          echo "Scope — core:$core vscode:$vscode nvim:$nvim zed:$zed code:$code website:$website"

  # ── Website build check (only when site/benchmark files change) ─────────────
  # Mirrors deploy-pages.yml's build so a broken template/data file is caught
  # BEFORE merge instead of silently failing the post-merge deploy.
  website:
    name: Website Build
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-24.04
    # The site is templates and one generated data file — no Rust, no wasm, no
    # git history ([WITHDRAWAL-SURFACES]).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      # Every word the site publishes is extracted from the messaging spec
      # ([WITHDRAWAL-COPY]); fail if the committed data drifted from it, so the
      # site can never say something the spec does not.
      - name: Check site copy is in sync with the messaging spec
        run: python3 scripts/gen_withdrawal_copy.py --check

      # Every published README renders from docs/readme/ ([README-DRIFT]) —
      # GitHub, the VSIX (Marketplace AND Open VSX), and PyPI cannot drift apart
      # or be edited in place.
      - name: Check generated READMEs
        run: |
          python3 scripts/gen_readmes.py --check
          python3 scripts/test_published_readmes.py

      # The generated READMEs are five of ~34 public surfaces. This scans the
      # rest — crate READMEs, the security policy, the package manifests, the
      # store descriptions, the site templates — for anything
      # [WITHDRAWAL-PROHIBITED] bars.
      - name: Scan every public surface for prohibited copy
        run: |
          python3 scripts/check_public_copy.py
          python3 scripts/test_check_public_copy.py

      - name: Build site
        working-directory: website
        run: npm run build

      # Withdrawal-contract tests ([WEBSITE-E2E-WITHDRAWAL]): the statement is
      # the approved copy, every retired URL still resolves, and no page says
      # anything [WITHDRAWAL-PROHIBITED] forbids. Both presets run on Chromium.
      - name: Install Playwright browser
        working-directory: website
        run: npx playwright install --with-deps chromium

      - name: Run withdrawal-contract tests (desktop + mobile)
        working-directory: website
        # CI uses the stdout `list` reporter only — no HTML report, trace,
        # video or screenshot is produced or uploaded ([GITHUB-NO-ARTIFACTS]).
        run: npm run test:e2e

  # ── Lint (runs in parallel with all test jobs) ─────────────────────────────
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install lld and ruff
        run: |
          sudo apt-get update && sudo apt-get install -y lld
          pip install ruff==0.16.1

      - name: Format check (Rust + Python)
        run: |
          cargo fmt --all -- --check
          ruff format --check --exclude '*/fixtures/*' .

      # Install the deslop duplication-gate CLI BEFORE `make lint` runs it
      # ([CI-DESLOP]). deslop is UNPINNED: scripts/install-deslop.sh (shared with
      # scripts/setup.sh) `brew install`s the latest release from nimblesite/tap
      # so the CLI never falls behind the engine the editor's LSP/MCP panel runs,
      # and appends the brew bin to $GITHUB_PATH so the next step sees it.
      - name: Install deslop
        run: scripts/install-deslop.sh

      - name: Install Rust security audit
        uses: taiki-e/install-action@81ee9698f20724138a785d788c7567d40f14cd2d # cargo-audit
        with:
          tool: cargo-audit@0.22.2

      # `make lint` runs clippy, eslint, AND the deslop duplication gate. The
      # threshold lives in committed .deslop.toml — ratcheted DOWN only, never
      # up — and deslop exits non-zero when repo-wide duplication exceeds it.
      - name: Lint (clippy + eslint + deslop)
        run: make lint

  # ── Zed Extension (runs in parallel) ───────────────────────────────────────
  zed:
    name: Zed Extension
    needs: changes
    # Its own tree, or any core change — the distribution mirror vendors
    # basilisk-common, so a core crate change must re-render + rebuild it.
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.zed == 'true'
    runs-on: ubuntu-24.04
    # Overrides the workflow-level RUSTFLAGS: this job links wasm32-wasip2, and
    # `-fuse-ld=lld` is a gcc/clang driver flag that rust-lld rejects. No lld is
    # installed here and none is needed.
    env:
      RUSTFLAGS: "-D warnings"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          # Bust the cache: a prior run cached host build-script binaries
          # (e.g. serde's build-script-build) linked against a glibc the
          # standard runner does not provide, so they failed to execute on
          # restore. A fresh prefix forces serde et al. to rebuild from
          # source against the runner's own glibc.
          prefix-key: v1-rust-glibc

      - name: Build Zed extension to WASM
        run: cargo build --release --target wasm32-wasip2 --manifest-path basilisk-zed/Cargo.toml

      - name: Clippy (Zed extension)
        run: cargo clippy --release --all-targets --manifest-path basilisk-zed/Cargo.toml

      - name: Run Zed extension unit tests
        run: cargo test --release --manifest-path basilisk-zed/Cargo.toml

      # Gate the DISTRIBUTION render, not just the in-place build above. The
      # release publishes a *standalone* tree produced by render-zed-mirror.sh
      # (vendored basilisk-common, stamped version, own workspace root) — a path
      # the `--manifest-path basilisk-zed/Cargo.toml` build never exercises.
      # Render at a real version and compile it standalone so a
      # render/vendoring/stamping/placeholder-guard regression fails HERE, on the
      # PR, instead of tanking the release job ([ZED-MIRROR]).
      - name: Render distribution mirror and build standalone
        run: |
          set -euo pipefail
          scripts/render-zed-mirror.sh "${RUNNER_TEMP}/zed-mirror" 0.0.0-ci
          ( cd "${RUNNER_TEMP}/zed-mirror" && cargo build --release --target wasm32-wasip2 )

      # The registry listing edits a ~1400-entry file in a repo we do not own,
      # and it only ever runs during a tagged release — so it gets its proof
      # here, on the PR, rather than the first time it touches upstream. Pure
      # text-editing functions only; no network ([ZED-MIRROR]).
      - name: Test the zed-industries listing edit
        run: |
          set -euo pipefail
          pip install pytest==9.1.1
          python3 -m pytest scripts/test_publish_zed_registry.py -q

  # ── Rust coverage + thresholds (runs in parallel) ──────────────────────────
  test-rust:
    name: Rust Tests & Coverage
    needs: changes
    if: needs.changes.outputs.core == 'true'
    # llvm-cov instruments and compiles the whole workspace before running every
    # target — CPU-bound, so it rides BIG_RUNNER too (see the mutation job for
    # the opt-in contract). Falls back to the standard runner when unset.
    runs-on: ${{ vars.BIG_RUNNER || 'ubuntu-24.04' }}
    # Two full workspace compiles dominate this job: the instrumented `ci`-profile
    # build (~8m) and the clean `--release` build the pristine fixture regression
    # requires (~5m). Tests and the fixture run itself are the cheap part. The
    # timeout must leave enough room for that internal regression evidence to run;
    # it is not a current official conformance result.
    timeout-minutes: 35
    steps:
      # cargo-llvm-cov instruments and RE-compiles the entire workspace, and the
      # pristine fixture regression clones its pinned python/typing snapshot fresh — together they exhausted the
      # runner's ~14 GB root disk ("No space left on device" mid-build). Reclaim
      # the ~25 GB of preinstalled toolchains this job never touches
      # (dotnet/android/ghc/CodeQL/boost) up front so the instrumented artifacts
      # always fit. Runs first, before any toolchain setup; harmless on runners
      # that lack these dirs (|| true). `df -h` logs the reclaimed headroom.
      - name: Free disk space for the instrumented build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # debugpy/ruff for the workspace tests; jinja2/markdown/tomlkit are the
      # REAL python/typing harness's own runtime deps (conformance/run_conformance.py
      # runs the suite's unmodified src/main.py — see [CHKARCH-CONFORMANCE]).
      - name: Install Python test dependencies
        run: pip install debugpy==1.8.21 ruff==0.16.1 jinja2 markdown tomlkit

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@81ee9698f20724138a785d788c7567d40f14cd2d # cargo-llvm-cov

      # NO fixture cache and NO vendored calculator, by design ([CHKARCH-CONFORMANCE]).
      # test-rust.sh freshly clones the declared historical python/typing
      # snapshot that still carries the removed Basilisk adapter and scores the
      # binary with that snapshot's OWN harness. This is a pristine-fixture
      # regression guard, not a current official conformance result.
      - name: Run Rust tests with coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/test-rust.sh

      # No artifact upload of the HTML coverage report ([GITHUB-NO-ARTIFACTS]).
      # Coverage is enforced in-job (test-rust.sh fails below threshold) and
      # published to Codecov below; the HTML is reproducible locally via
      # `make test`, so storing it would just bill GB-days for nothing.
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ── VS Code extension (runs in parallel) ───────────────────────────────────
  test-vscode:
    name: VS Code Extension
    needs: changes
    # The extension is a notice ([WITHDRAWAL-SURFACES]): it bundles no binary
    # and starts no language server, so a core Rust change can no longer alter
    # what this suite exercises. Its own tree is the only trigger left.
    if: needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-24.04
    # No Rust toolchain, no debugpy, no real-world corpus, no per-platform
    # binary: packaging the VSIX and driving one small suite in a VS Code
    # instance under xvfb is all that remains.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install xvfb and VS Code test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libnspr4 \
            libnss3 \
            libgbm1 \
            libxkbfile1 \
            libsecret-1-0 \
            libgtk-3-0 \
            libxss1 \
            libxtst6 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libgdk-pixbuf2.0-0 \
            libdbus-1-3
          # libasound2 was renamed to libasound2t64 on Ubuntu 24.04+
          sudo apt-get install -y libasound2 2>/dev/null || sudo apt-get install -y libasound2t64

      # @vscode/test-electron downloads a full VS Code build (~150 MB) into
      # .vscode-test on every run. Cache it keyed on the test config + manifest
      # so the pinned editor version is reused instead of re-downloaded; a
      # version bump (config/manifest change) busts the key and re-fetches.
      - name: Cache VS Code test build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vscode-extension/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('vscode-extension/.vscode-test.mjs', 'vscode-extension/package.json') }}
          restore-keys: vscode-test-${{ runner.os }}-

      - name: Run VS Code extension tests
        run: make _test_vsix

  # ── VS Code extension on Windows (runs in parallel) ────────────────────────
  # Implements [VSIX-CI-PLATFORM-COVERAGE] (docs/specs/VSIX-SPEC.md).
  # The VSIX is platform-neutral now — it bundles no binary — so this job no
  # longer guards `.exe` suffixes or per-platform bundle paths. It still guards
  # the one thing that is genuinely OS-dependent and shipped: the extension
  # host loading and running the notice on Windows, where path handling and the
  # `vscode-test` launcher differ.
  test-vscode-windows:
    name: VS Code Extension (Windows)
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    # Git Bash — the repo's scripts and these steps are POSIX shell.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      # Keyed on runner.os, so this is a Windows-only cache bucket and never
      # collides with the Linux job's VS Code download.
      - name: Cache VS Code test build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vscode-extension/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('vscode-extension/.vscode-test.mjs', 'vscode-extension/package.json') }}
          restore-keys: vscode-test-${{ runner.os }}-

      - name: Build the extension
        working-directory: vscode-extension
        run: |
          npm ci
          npm run compile

      # BSK_TEST_BAIL=0 (see .vscode-test.mjs) makes this job report EVERY
      # win32 failure in one run rather than hiding the next behind the first.
      - name: Run VS Code extension tests
        working-directory: vscode-extension
        env:
          BSK_TEST_BAIL: "0"
        run: npx vscode-test --label workspace-suite

  verify-binaries:
    name: Shipwright Binary Gate
    needs: changes
    # Core builds the binaries this gate version-checks; vscode-extension owns
    # the shipwright manifest + package.json version it verifies against them.
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # Share one release-profile cache scope with the `build` gate below: both
      # jobs run `cargo build --release`, so they compile the identical external
      # dependency graph. A single shared scope (instead of two per-job scopes)
      # halves this pair's cache footprint — relieving the 10 GB repo-cache limit
      # that was evicting warm caches — and lets `build` (which starts as soon as
      # this job's cache is saved) restore the dependencies this job compiled.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          shared-key: release

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Build the Shipwright binary
        run: cargo build --release --bin basilisk

      - name: Install VSIX verifier dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Verify manifest and binary version contracts
        working-directory: vscode-extension
        run: |
          npm run test:shipwright
          node scripts/verify-shipwright.mjs versions ../target/release/basilisk

      - name: Verify Typeshed release attribution policy
        run: python3 scripts/verify_release_attribution.py --policy-only

  # ── Neovim extension (runs in parallel) ────────────────────────────────────
  test-nvim:
    name: Neovim Extension (${{ matrix.neovim.label }})
    needs: changes
    # The plugin is a notice ([WITHDRAWAL-SURFACES]): it starts no language
    # server and no debug adapter, so a core Rust change can no longer alter
    # what this suite exercises. Its own tree is the only trigger left.
    if: needs.changes.outputs.nvim == 'true'
    runs-on: ubuntu-24.04
    # One spec directory against a plugin with three modules. This is a hang
    # backstop, not a perf budget.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The plugin requires Neovim 0.11+, so the matrix covers the supported
        # floor and the forward-compat tip.
        neovim:
          - label: "0.11"
            version: v0.11.6
          - label: nightly
            version: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install luarocks
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
          luarocks install --local luacov

      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: ${{ matrix.neovim.version }}

      # The harness git-clones plenary into /tmp on every run. Cache it so the
      # clone becomes a no-op. Bump the key suffix to refresh the pin.
      - name: Cache Neovim test plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/plenary.nvim
          key: nvim-test-plugins-${{ runner.os }}-${{ matrix.neovim.label }}-v2

      - name: Run Neovim extension tests
        run: |
          eval "$(luarocks path)"
          export PATH="$HOME/.luarocks/bin:$PATH"
          ./scripts/test-nvim.sh

  # Fan-in gate for the Neovim matrix. Branch protection on main requires the
  # context "Neovim Extension" (the job's pre-matrix name); the matrix legs
  # report as "Neovim Extension (0.11)" / "(nightly)", so without this job the
  # required context never reports and every PR is blocked forever — the same
  # pitfall documented on mutation-test-shard below. Mirrors the Mutation
  # Testing shard→merge pattern: succeeds only when every leg succeeded, or
  # when the matrix was legitimately skipped by change scope; a failed or
  # cancelled leg fails the gate.
  nvim-gate:
    name: Neovim Extension
    needs: test-nvim
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Assert every Neovim matrix leg succeeded
        run: |
          result="${{ needs.test-nvim.result }}"
          echo "test-nvim matrix result: $result"
          [ "$result" = "success" ] || [ "$result" = "skipped" ]

  # ── Mutation testing (runs in parallel shards) ─────────────────────────────
  mutation-test-shard:
    name: Mutation Testing Shard ${{ matrix.label }}
    needs: changes
    # NOTE: no job-level `if`. Each of the four shards is a REQUIRED status check
    # by its expanded name ("Mutation Testing Shard 1-of-4" …). A job-level skip
    # collapses the matrix to the literal, unexpanded "… ${{ matrix.label }}", so
    # the four required contexts never report and branch protection blocks the PR
    # forever. Instead the matrix always expands and every step is gated on
    # `core`: when a PR touches no core Rust the steps no-op and each shard
    # reports success in seconds, satisfying the required checks at ~zero cost.
    env:
      RUN: ${{ needs.changes.outputs.core }}
    # Big-runner opt-in via a single org/repo Actions variable. Set BIG_RUNNER to
    # the label of the Nimblesite GitHub-hosted larger runner to route the real,
    # CPU-bound mutation work onto it; leave it unset and the job falls back to
    # the standard hosted runner so CI never breaks on a missing label. The
    # variable is the single source of truth — change the machine in one place.
    #
    # The `core` guard keeps the larger runner off no-op shards: this job has no
    # job-level `if` (the four shards must always report as required checks), so
    # on a non-core PR every shard still starts but every step no-ops.
    # Only bill BIG_RUNNER when there is actually Rust to mutate; otherwise these
    # seconds-long no-ops run on the standard runner.
    runs-on: ${{ (needs.changes.outputs.core == 'true' && vars.BIG_RUNNER) || 'ubuntu-24.04' }}
    # cargo-mutants rebuilds + reruns the test suite once per mutant, so it is
    # heavily CPU-bound — the primary reason BIG_RUNNER exists. The 20-minute
    # budget was calibrated for an 8-core larger runner; the standard hosted
    # runner is far slower. Empirically the four fallback shards land at ~43/50/
    # 54/60+ min, so the previous 60-min ceiling was ~1x headroom, not the 3x it
    # claimed — the heaviest shard tips over it and gets cancelled mid-run
    # (a wall-clock cancellation, NOT a surviving mutant). 90 min restores real
    # headroom on the fallback path WITHOUT weakening the mutation gate: the
    # merge job still enforces the score against the committed baseline, so every
    # mutant is still tested and must be killed. On BIG_RUNNER the shards finish
    # well under it; the ceiling is harmless.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "0/4"
            label: 1-of-4
            output: 0-of-4
          - shard: "1/4"
            label: 2-of-4
            output: 1-of-4
          - shard: "2/4"
            label: 3-of-4
            output: 2-of-4
          - shard: "3/4"
            label: 4-of-4
            output: 3-of-4
    steps:
      # cargo-mutants copies the workspace and does a full build PER mutant, so
      # the standard runner's ~14 GB root disk fills mid-shard ("No space left
      # on device") — which cargo-mutants then records as spurious `unviable`
      # mutants, dropping the merged `caught` count and failing the score gate
      # even though no real mutant survived. Reclaim the ~25 GB of preinstalled
      # toolchains this job never touches up front, exactly like the instrumented
      # coverage build does. Gated on RUN so no-op shards stay seconds-fast.
      - name: Free disk space for the per-mutant builds
        if: env.RUN == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          # All four shards share one cache scope (identical job name + flags),
          # so only the first needs to upload the ~290 MB cache. The other three
          # restore it but skip the redundant save race (last-writer churn).
          save-if: ${{ env.RUN == 'true' && matrix.shard == '0/4' }}

      - if: env.RUN == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install lld
        if: env.RUN == 'true'
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Install cargo-mutants
        if: env.RUN == 'true'
        uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad # v2
        with:
          # Pin the exact version: cargo-mutants adds mutation operators between
          # releases (e.g. the `StructField` deletion operator), so an unpinned
          # tool silently changes the mutant pool and the baseline stops being
          # reproducible. The committed baseline is measured against this version.
          tool: cargo-mutants@27.1.0

      - name: Run mutation test shard
        if: env.RUN == 'true'
        run: make _mutation_test SHARD="${{ matrix.shard }}" MUTATION_CHECK=0

      # The ONLY artifact CI is allowed to create ([GITHUB-NO-ARTIFACTS]): a
      # transient in-run hand-off so the `mutation-test` job below can merge the
      # four shards' outcomes and enforce the score gate. retention-days: 1 is
      # the floor — it is consumed and auto-deleted within the same run, so it
      # never accrues stored GB-days. It is NOT a retained build output.
      - name: Upload mutation shard output
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-output-${{ matrix.label }}
          path: mutation_testing/mutants.out.working-shard-${{ matrix.output }}/mutants.out/
          retention-days: 1

  mutation-test:
    name: Mutation Testing
    runs-on: ubuntu-24.04
    needs: [changes, mutation-test-shard]
    if: needs.changes.outputs.core == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download mutation shard outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-output-*
          path: mutation_testing/shards

      - name: Merge mutation shards and check baseline
        run: |
          python3 scripts/mutation_merge_outcomes.py \
            mutation_testing/shards/mutation-output-*/outcomes.json \
            --output mutation_testing/mutants.out.working/mutants.out/outcomes.json
          python3 mutation_testing/mutants_report.py \
            mutation_testing/mutants.out.working/mutants.out/outcomes.json \
            mutation_testing/mutants_report.html \
            --scores mutation_testing/mutation_scores.json \
            --scope working
          # The merge step ABOVE is the gate: it fails the job if the mutation
          # score regresses against the committed baseline. The HTML report is
          # not uploaded as an artifact ([GITHUB-NO-ARTIFACTS]) — it is
          # reproducible locally via `make _mutation_test`.

  # ── Mutated-suite conformance: NO JOB, BY POLICY ───────────────────────────
  # A job named "Mutated Conformance Ratchet" lived here. It ran
  # `conformance/run_mutation_conformance.py` as a REQUIRED CHECK that failed
  # when the measured pass rate fell below a committed floor.
  #
  # DELETED, NOT MOVED OR DISABLED. CLAUDE.md: conformance is "never a gate,
  # threshold, or ratchet ANYWHERE ... in `coverage-thresholds.json`,
  # `make test`, CI, or a script." A conformance floor is the exact incentive
  # that produced the fitting this repository is being emptied of: with a
  # ratchet in CI, deleting a rule that only worked on the fixtures' spelling
  # turns the build red, so the cheapest route to green is to keep the
  # cheating code. A drop caused by REMOVING text-matched logic is progress and
  # must be recordable without failing a build.
  #
  # The measurement itself is kept and still runnable locally
  # (`make conformance MUTATED=1`); the script exits 0 whatever it measures.
  # Do not reintroduce this job, a `needs:` on it, or any threshold check.

  # ── Build gate (standard job name per repo standards) ──────────────────────
  # `needs` is deliberately NARROW. This job consumes nothing from the test jobs
  # — its only step is `cargo build --release` — so fanning it in on all of them
  # bought no signal and appended its whole runtime to the END of every core PR,
  # after the slowest test job had already finished. Every one of those jobs is
  # INDEPENDENTLY a required status check on main (Lint, Zed Extension, Rust
  # Tests & Coverage, VS Code Extension, Shipwright Binary Gate, Neovim
  # Extension, the four Mutation Testing Shards, Mutation Testing, and Build),
  # so a failing test still blocks the merge on its own contexts; the dropped
  # edges were pure ordering, never gating.
  #
  # The one retained edge is load-bearing: verify-binaries owns the SAVE of the
  # `release` cache scope, and `needs` waits for its post-save step, so this job
  # still restores a warm dependency cache and stays a near-no-op compile.
  build:
    name: Build
    needs: [changes, verify-binaries]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # Reuse the release-profile dependency cache that `verify-binaries`
      # populated earlier in this run (shared scope, same Cargo build). save-if
      # is false because that job already owns the save — this gate only needs to
      # restore so its `cargo build --release` is a warm, near-no-op compile.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          shared-key: release
          save-if: false

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Build Rust (release)
        run: cargo build --release

  # ── Dependency review ([GITHUB-DEP-REVIEW]) ────────────────────────────────
  # Blocks PRs that introduce dependencies with known-high vulnerabilities. This
  # is the repo's ONLY dependency vuln-gate — there is no cargo-deny/osv gate, so
  # there is no doubling-up. It is SEPARATE from CodeQL (codeql.yml = vulnerable
  # code) and `make lint` (style/correctness): one owner per concern. PR-only by
  # construction — dependency-review diffs base vs head — which matches this
  # workflow's pull_request-only trigger.
  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # dependency-review posts its PR summary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

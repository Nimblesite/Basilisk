# agent-pmo:f87d349
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Least-privilege default ([SWR-SEC-TOKEN-PRIVILEGE]). CI only reads the repo;
# any job needing more must opt in with a job-scoped permissions block.
permissions:
  contents: read

jobs:
  # ── Lint (runs in parallel with all test jobs) ─────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install lld and ruff
        run: |
          sudo apt-get update && sudo apt-get install -y lld
          pip install ruff

      - name: Format check (Rust + Python)
        run: |
          cargo fmt --all -- --check
          ruff format --check --exclude '*/fixtures/*' .

      - name: Lint (clippy + eslint)
        run: make lint

      # Deslop duplication gate ([CI-DESLOP]). The threshold lives in committed
      # .deslop.toml — ratcheted DOWN only, never up. `deslop .` reads it and
      # exits 3 (tanks the build) when repo-wide duplication exceeds it.
      - name: Deslop duplication gate
        env:
          DESLOP_VERSION: "0.5.1" # pin — see https://github.com/Nimblesite/Deslop/releases
        run: |
          curl -sSfL "https://github.com/Nimblesite/Deslop/releases/download/v${DESLOP_VERSION}/deslop-${DESLOP_VERSION}-linux-x64.tar.gz" | tar -xz
          echo "$PWD/deslop-${DESLOP_VERSION}-linux-x64" >> "$GITHUB_PATH"
          deslop .

  # ── Zed Extension (runs in parallel) ───────────────────────────────────────
  zed:
    name: Zed Extension
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          # Bust the cache: a prior run cached host build-script binaries
          # (e.g. serde's build-script-build) linked against a glibc the
          # standard runner does not provide, so they failed to execute on
          # restore. A fresh prefix forces serde et al. to rebuild from
          # source against the runner's own glibc.
          prefix-key: v1-rust-glibc

      - name: Build Zed extension to WASM
        run: cargo build --release --target wasm32-wasip2 --manifest-path basilisk-zed/Cargo.toml

      - name: Clippy (Zed extension)
        run: cargo clippy --release --all-targets --manifest-path basilisk-zed/Cargo.toml

      - name: Run Zed extension unit tests
        run: cargo test --release --manifest-path basilisk-zed/Cargo.toml

  # ── Rust coverage + thresholds (runs in parallel) ──────────────────────────
  test-rust:
    name: Rust Tests & Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: pip install debugpy ruff

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@81ee9698f20724138a785d788c7567d40f14cd2d # cargo-llvm-cov

      - name: Run Rust tests with coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/test-rust.sh

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: target/llvm-cov/html/
          retention-days: 14

      - name: Upload to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ── VS Code extension (runs in parallel) ───────────────────────────────────
  test-vscode:
    name: VS Code Extension
    runs-on: ubuntu-24.04
    # TIMEOUT EXCEPTION: VS Code extension e2e tests launch a full VS Code instance via xvfb, requiring ~25 min
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: pip install debugpy ruff

      - name: Install lld, xvfb, and VS Code test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            lld \
            xvfb \
            libnspr4 \
            libnss3 \
            libgbm1 \
            libxkbfile1 \
            libsecret-1-0 \
            libgtk-3-0 \
            libxss1 \
            libxtst6 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libgdk-pixbuf2.0-0 \
            libdbus-1-3
          # libasound2 was renamed to libasound2t64 on Ubuntu 24.04+
          sudo apt-get install -y libasound2 2>/dev/null || sudo apt-get install -y libasound2t64

      - name: Run VS Code extension tests
        run: make _test_vsix

  verify-binaries:
    name: Shipwright Binary Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Build Shipwright binaries
        run: cargo build --release --bin basilisk --bin basilisk-profiler-helper

      - name: Install VSIX verifier dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Verify manifest and binary version contracts
        working-directory: vscode-extension
        run: |
          npm run test:shipwright
          node scripts/verify-shipwright.mjs versions \
            ../target/release/basilisk \
            ../target/release/basilisk-profiler-helper

  # ── Neovim extension (runs in parallel) ────────────────────────────────────
  test-nvim:
    name: Neovim Extension
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pytest and luarocks
        run: |
          pip install pytest
          sudo apt-get install -y luarocks
          luarocks install --local luacov

      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: v0.11.6

      - name: Run Neovim extension tests
        run: |
          eval "$(luarocks path)"
          export PATH="$HOME/.luarocks/bin:$PATH"
          ./scripts/test-nvim.sh

  # ── Mutation testing (runs in parallel shards) ─────────────────────────────
  mutation-test-shard:
    name: Mutation Testing Shard ${{ matrix.label }}
    runs-on: ubuntu-24.04
    # cargo-mutants rebuilds + reruns the test suite once per mutant, so it is
    # heavily CPU-bound. The 20-minute budget was calibrated for the retired
    # 8-core larger runners; on the standard hosted runner the slower shards
    # tip over the limit non-deterministically. 60 min gives ~3x headroom
    # without weakening the mutation gate (the merge job still enforces score).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "0/4"
            label: 1-of-4
            output: 0-of-4
          - shard: "1/4"
            label: 2-of-4
            output: 1-of-4
          - shard: "2/4"
            label: 3-of-4
            output: 2-of-4
          - shard: "3/4"
            label: 4-of-4
            output: 3-of-4
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Install cargo-mutants
        uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad # v2
        with:
          tool: cargo-mutants

      - name: Run mutation test shard
        run: make mutation-test SHARD="${{ matrix.shard }}" MUTATION_CHECK=0

      - name: Upload mutation shard output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-output-${{ matrix.label }}
          path: mutation_testing/mutants.out.working-shard-${{ matrix.output }}/mutants.out/
          retention-days: 14

  mutation-test:
    name: Mutation Testing
    runs-on: ubuntu-24.04
    needs: mutation-test-shard
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download mutation shard outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutation-output-*
          path: mutation_testing/shards

      - name: Merge mutation shards and check baseline
        run: |
          python3 scripts/mutation_merge_outcomes.py \
            mutation_testing/shards/mutation-output-*/outcomes.json \
            --output mutation_testing/mutants.out.working/mutants.out/outcomes.json
          python3 mutation_testing/mutants_report.py \
            mutation_testing/mutants.out.working/mutants.out/outcomes.json \
            mutation_testing/mutants_report.html \
            --scores mutation_testing/mutation_scores.json \
            --scope working

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report
          path: |
            mutation_testing/mutants_report.html
            mutation_testing/mutants.out.working/mutants.out/
          retention-days: 14

  # ── Build gate (standard job name per repo standards) ──────────────────────
  build:
    name: Build
    needs: [test-rust, test-vscode, test-nvim, zed, mutation-test, verify-binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Build Rust (release)
        run: cargo build --release

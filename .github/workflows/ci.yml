name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust — Format → Clippy → Test
    runs-on: ubuntu-latest
    env:
      TEST_COVERAGE_BASILISK_CHECKER: ${{ vars.TEST_COVERAGE_BASILISK_CHECKER || '89' }}
      TEST_COVERAGE_BASILISK_CLI: ${{ vars.TEST_COVERAGE_BASILISK_CLI || '96' }}
      TEST_COVERAGE_BASILISK_DB: ${{ vars.TEST_COVERAGE_BASILISK_DB || '100' }}
      TEST_COVERAGE_BASILISK_LSP: ${{ vars.TEST_COVERAGE_BASILISK_LSP || '50' }}
      TEST_COVERAGE_BASILISK_MOJO: ${{ vars.TEST_COVERAGE_BASILISK_MOJO || '90' }}
      TEST_COVERAGE_BASILISK_PARSER: ${{ vars.TEST_COVERAGE_BASILISK_PARSER || '100' }}
      TEST_COVERAGE_BASILISK_PLUGIN: ${{ vars.TEST_COVERAGE_BASILISK_PLUGIN || '100' }}
      TEST_COVERAGE_BASILISK_RESOLVER: ${{ vars.TEST_COVERAGE_BASILISK_RESOLVER || '94' }}
      TEST_COVERAGE_BASILISK_STUBS: ${{ vars.TEST_COVERAGE_BASILISK_STUBS || '100' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy --all-targets
        run: cargo clippy --all-targets
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run test.sh (tests + coverage + threshold enforcement)
        run: ./scripts/test.sh
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  lsp:
    name: LSP — Integration Tests
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build basilisk binary
        run: cargo build -p basilisk-cli
      - name: Run LSP integration tests
        run: ./scripts/test-lsp.sh

  vscode-extension:
    name: VS Code Extension — Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Compile TypeScript
        run: npm run compile
      - name: Check for TypeScript errors
        run: npx tsc --noEmit

  vscode-e2e:
    name: VS Code Extension — E2E Tests
    runs-on: ubuntu-latest
    needs: [rust, vscode-extension]
    steps:
      - uses: actions/checkout@v4

      # Rust toolchain + build basilisk binary
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build basilisk binary (debug)
        run: cargo build -p basilisk-cli

      # Node.js + extension build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install extension dependencies
        run: cd vscode-extension && npm ci
      - name: Compile extension
        run: cd vscode-extension && npm run compile

      # Python for debugger tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install debugpy
        run: pip install debugpy

      # xvfb for headless VS Code
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Run E2E tests (LSP integration, debug integration, etc.)
      - name: Run VS Code E2E tests
        run: xvfb-run -a npm test
        working-directory: vscode-extension
        env:
          DISPLAY: ":99"
          # Point tests to the debug-built basilisk binary
          BASILISK_EXECUTABLE_PATH: ${{ github.workspace }}/target/debug/basilisk

  debugger:
    name: Debugger — E2E Stepping Tests
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4

      # Rust toolchain + build basilisk binary
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build basilisk binary (debug)
        run: cargo build -p basilisk-cli

      # Python for debugger tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install debugpy
        run: pip install debugpy

      # Node.js + extension build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install extension dependencies
        run: cd vscode-extension && npm ci
      - name: Compile extension
        run: cd vscode-extension && npm run compile

      # xvfb for headless VS Code
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Run debugger-specific tests with longer timeout
      - name: Run debugger integration tests
        run: |
          xvfb-run -a npx vscode-test \
            --extensionDevelopmentPath=. \
            --extensionTestsPath=./out/test/suite/index \
            --launchArgs --disable-extensions
        working-directory: vscode-extension
        timeout-minutes: 10
        env:
          DISPLAY: ":99"
          BASILISK_EXECUTABLE_PATH: ${{ github.workspace }}/target/debug/basilisk
          # Run with longer mocha timeout for debug stepping tests
          MOCHA_TIMEOUT: "120000"

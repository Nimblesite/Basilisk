name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Lint (runs in parallel with test) ────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: clippy (workspace)
        run: cargo clippy --release --all-targets

      - name: clippy (zed extension)
        run: cargo clippy --release --all-targets --manifest-path basilisk-zed/Cargo.toml

  # ── Zed Extension (runs in parallel) ────────────────────────────────────────
  zed:
    name: Zed Extension (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: wasm32-wasip2
            test: false
          - os: ubuntu-latest
            target: native
            test: true
          - os: macos-latest
            target: native
            test: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'wasm32-wasip2' && 'wasm32-wasip2' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build Zed extension to WASM
        if: matrix.target == 'wasm32-wasip2'
        run: cargo build --release --target wasm32-wasip2 --manifest-path basilisk-zed/Cargo.toml

      - name: Clippy (Zed extension)
        if: matrix.test
        run: cargo clippy --release --all-targets --manifest-path basilisk-zed/Cargo.toml

      - name: Run Zed extension unit tests
        if: matrix.test
        run: cargo test --release --manifest-path basilisk-zed/Cargo.toml

  # ── Test (runs in parallel with lint) ────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      TEST_COVERAGE_BASILISK_CHECKER: ${{ vars.TEST_COVERAGE_BASILISK_CHECKER || '89' }}
      TEST_COVERAGE_BASILISK_CLI: ${{ vars.TEST_COVERAGE_BASILISK_CLI || '84' }}
      TEST_COVERAGE_BASILISK_DB: ${{ vars.TEST_COVERAGE_BASILISK_DB || '100' }}
      TEST_COVERAGE_BASILISK_LSP: ${{ vars.TEST_COVERAGE_BASILISK_LSP || '50' }}
      TEST_COVERAGE_BASILISK_MOJO: ${{ vars.TEST_COVERAGE_BASILISK_MOJO || '90' }}
      TEST_COVERAGE_BASILISK_PARSER: ${{ vars.TEST_COVERAGE_BASILISK_PARSER || '100' }}
      TEST_COVERAGE_BASILISK_PLUGIN: ${{ vars.TEST_COVERAGE_BASILISK_PLUGIN || '100' }}
      TEST_COVERAGE_BASILISK_RESOLVER: ${{ vars.TEST_COVERAGE_BASILISK_RESOLVER || '94' }}
      TEST_COVERAGE_BASILISK_STUBS: ${{ vars.TEST_COVERAGE_BASILISK_STUBS || '100' }}
      TEST_COVERAGE_BASILISK_CONFIG: ${{ vars.TEST_COVERAGE_BASILISK_CONFIG || '80' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: pip install debugpy ruff

      - name: Install lld, xvfb, and VS Code test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            lld \
            xvfb \
            libnspr4 \
            libnss3 \
            libgbm1 \
            libxkbfile1 \
            libsecret-1-0 \
            libgtk-3-0 \
            libxss1 \
            libxtst6 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libgdk-pixbuf2.0-0 \
            libdbus-1-3
          # libasound2 was renamed to libasound2t64 on Ubuntu 24.04+
          sudo apt-get install -y libasound2 2>/dev/null || sudo apt-get install -y libasound2t64

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run all tests
        run: ./scripts/test.sh

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/llvm-cov/html/
          retention-days: 14

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

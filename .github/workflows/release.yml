name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build binary - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: basilisk
            archive: basilisk-x86_64-unknown-linux-gnu.tar.gz
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: basilisk
            archive: basilisk-aarch64-unknown-linux-gnu.tar.gz
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-15
            binary: basilisk
            archive: basilisk-aarch64-apple-darwin.zip
          - platform: win32-x64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: basilisk.exe
            archive: basilisk-x86_64-pc-windows-msvc.zip
          - platform: win32-arm64
            target: aarch64-pc-windows-msvc
            os: windows-latest
            binary: basilisk.exe
            archive: basilisk-aarch64-pc-windows-msvc.zip

    steps:
      - uses: actions/checkout@v4

      - name: Stamp release version
        shell: bash
        run: scripts/stamp-version.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin basilisk

      - name: Package macOS archive
        if: startsWith(matrix.platform, 'darwin-')
        run: |
          set -euo pipefail
          binary_path="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          ditto -c -k --keepParent "$binary_path" "${{ matrix.archive }}"

      - name: Package Linux archive
        if: startsWith(matrix.platform, 'linux-')
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ matrix.binary }}

      - name: Package Windows archive
        if: startsWith(matrix.platform, 'win32-')
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  vsix:
    name: VSIX - ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
            rust_target: aarch64-apple-darwin
            npm_config_arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            npm_config_arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            npm_config_arch: arm64
            cross: true
          - os: windows-latest
            platform: win32
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            npm_config_arch: x64
          - os: windows-latest
            platform: win32
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
            npm_config_arch: arm64
            cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Stamp release version
        shell: bash
        run: scripts/stamp-version.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install cross-compilation tools
        if: matrix.rust_target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: vsix-${{ matrix.rust_target }}
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_config_arch }}

      - name: Validate Shipwright manifest
        working-directory: vscode-extension
        run: npm run test:shipwright

      - name: Build VSIX runtime binaries
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.rust_target }} --bin basilisk
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            cargo build --release --target ${{ matrix.rust_target }} --bin basilisk-profiler-helper
          fi

      - name: Set vsce target
        shell: pwsh
        run: echo "target=${{ matrix.platform }}-${{ matrix.arch }}" >> $env:GITHUB_ENV

      - name: Stage Shipwright manifest and runtime binaries
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ matrix.platform }}" = "win32" ]; then exe=".exe"; fi
          rm -rf vscode-extension/bin
          mkdir -p "vscode-extension/bin/${{ env.target }}"
          cp "target/${{ matrix.rust_target }}/release/basilisk${exe}" "vscode-extension/bin/${{ env.target }}/"
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            cp "target/${{ matrix.rust_target }}/release/basilisk-profiler-helper" "vscode-extension/bin/${{ env.target }}/"
          fi
          cp shipwright.json vscode-extension/shipwright.json
          cp NOTICES vscode-extension/NOTICES

      # Skip on cross-compiled targets: the runner's CPU arch can't execute
      # the produced binary (x64 host -> aarch64 target). The VSIX contents
      # check below still runs and validates the zipped layout.
      - name: Verify runtime version contracts
        if: ${{ !matrix.cross }}
        working-directory: vscode-extension
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ matrix.platform }}" = "win32" ]; then exe=".exe"; fi
          args=("bin/${{ env.target }}/basilisk${exe}")
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            args+=("bin/${{ env.target }}/basilisk-profiler-helper")
          fi
          node scripts/verify-shipwright.mjs versions "${args[@]}"

      - name: Package VSIX
        working-directory: vscode-extension
        shell: bash
        run: |
          set -euo pipefail
          # vsce refuses to publish with `--pre-release` unless the VSIX was
          # also *packaged* with `--pre-release` (it sets preRelease=true in
          # the embedded manifest). Pass it here for any SemVer prerelease tag.
          flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flag="--pre-release"
          fi
          npx vsce package $flag --target "${{ env.target }}" --ignore-other-target-folders --out "basilisk-${{ env.target }}.vsix"

      - name: Verify VSIX contents
        working-directory: vscode-extension
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ matrix.platform }}" = "win32" ]; then exe=".exe"; fi
          unzip -l "basilisk-${{ env.target }}.vsix" | grep -F "bin/${{ env.target }}/basilisk${exe}"
          unzip -l "basilisk-${{ env.target }}.vsix" | grep -F "shipwright.json"
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            unzip -l "basilisk-${{ env.target }}.vsix" | grep -F "bin/${{ env.target }}/basilisk-profiler-helper"
          fi
          node scripts/verify-shipwright.mjs vsix "basilisk-${{ env.target }}.vsix" "${{ env.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.target }}
          path: vscode-extension/*.vsix

  publish-vsix:
    name: Publish VSIX
    needs: vsix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: success() && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4

      - name: Publish to VS Code Marketplace
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCODE_MARKETPLACE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::error::VSCODE_MARKETPLACE_PAT not accessible. If it exists at the Nimblesite org level, add Basilisk to its allowed repositories under Org Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Tags like v0.1.0-alpha / v0.1.0-beta / v0.1.0-rc.1 are prerelease.
          # Plain vX.Y.Z is a stable release. Marketplace requires the
          # --pre-release flag for any SemVer prerelease suffix; without it,
          # vsce rejects the publish.
          flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flag="--pre-release"
            echo "Detected prerelease tag ${GITHUB_REF_NAME}; publishing with --pre-release"
          else
            echo "Detected stable tag ${GITHUB_REF_NAME}; publishing to stable channel"
          fi
          # One publish per platform-specific VSIX. vsce requires a separate
          # publish call for each --target platform; globbing all into one
          # publish silently uses only the first.
          shopt -s globstar nullglob
          published=0
          for vsix in **/*.vsix; do
            echo "Publishing $vsix"
            npx --yes @vscode/vsce publish $flag --packagePath "$vsix"
            published=$((published + 1))
          done
          if [ "$published" -eq 0 ]; then
            echo "::error::No VSIX artifacts found to publish"
            exit 1
          fi
          echo "Published $published VSIX(es) to the Marketplace"

  github-release:
    name: Create GitHub Release
    needs: [build, vsix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Flatten: each upload's `name:` is the file itself, so without
          # merging, download-artifact@v4 creates artifacts/<file>/<file>
          # — `mv *.tar.gz artifacts/` then collides with the directory.
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum ./*.tar.gz ./*.zip ./*.vsix > checksums-sha256.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Any tag with a SemVer prerelease suffix (v0.1.0-alpha,
          # v0.1.0-beta, v0.1.0-rc.1, …) marks the GitHub release as
          # prerelease so it does not become the "Latest release".
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.vsix
            artifacts/checksums-sha256.txt

  deploy-pages:
    name: Deploy GitHub Pages
    needs: github-release
    # Only stable releases update the live site. SemVer prerelease tags
    # (v0.1.0-alpha, v0.1.0-rc.1, …) contain a hyphen and are skipped.
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml

  publish-homebrew:
    name: Publish Homebrew formula
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Render formula and push to tap
        env:
          BREW_SCOOP_PAT: ${{ secrets.BREW_SCOOP_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${BREW_SCOOP_PAT:-}" ]; then
            echo "::error::BREW_SCOOP_PAT not accessible. The Nimblesite org secret exists; ensure Basilisk is in its allowed repositories (Org Settings → Secrets and variables → Actions → BREW_SCOOP_PAT → Repository access)."
            exit 1
          fi

          export BASILISK_VERSION="${GITHUB_REF_NAME#v}"
          export BASILISK_BASE_URL="https://github.com/Nimblesite/Basilisk/releases/download/${GITHUB_REF_NAME}"
          BASILISK_SHA_DARWIN_ARM64="$(sha256sum artifacts/basilisk-aarch64-apple-darwin.zip | awk '{print $1}')"
          BASILISK_SHA_LINUX_X86_64="$(sha256sum artifacts/basilisk-x86_64-unknown-linux-gnu.tar.gz | awk '{print $1}')"
          BASILISK_SHA_LINUX_AARCH64="$(sha256sum artifacts/basilisk-aarch64-unknown-linux-gnu.tar.gz | awk '{print $1}')"
          export BASILISK_SHA_DARWIN_ARM64 BASILISK_SHA_LINUX_X86_64 BASILISK_SHA_LINUX_AARCH64

          git clone "https://x-access-token:${BREW_SCOOP_PAT}@github.com/Nimblesite/homebrew-tap.git" tap
          mkdir -p tap/Formula

          # envsubst with an explicit variable list — leaves Ruby's #{...}
          # interpolation untouched and only substitutes BASILISK_*.
          envsubst '${BASILISK_VERSION} ${BASILISK_BASE_URL} ${BASILISK_SHA_DARWIN_ARM64} ${BASILISK_SHA_LINUX_X86_64} ${BASILISK_SHA_LINUX_AARCH64}' \
            < .github/release-templates/basilisk.rb.tmpl \
            > tap/Formula/basilisk.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/basilisk.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${BASILISK_VERSION}"
            exit 0
          fi
          git commit -m "basilisk ${BASILISK_VERSION}"
          git push

  publish-nvim:
    name: Publish Neovim plugin
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          # `git subtree split` replays the full history of basilisk.nvim/, so
          # the shallow default checkout is not enough.
          fetch-depth: 0

      - name: Split basilisk.nvim/ into a standalone tree
        id: split
        run: |
          set -euo pipefail
          # Neovim plugin managers (and the built-in vim.pack) can only install
          # a repo whose root *is* the plugin — none install from a repo
          # subdirectory. `git subtree split` rewrites basilisk.nvim/ into a
          # commit whose tree root is the plugin, which we publish to a mirror.
          sha="$(git subtree split --prefix=basilisk.nvim)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Publish to the basilisk.nvim mirror
        env:
          NVIM_MIRROR_PAT: ${{ secrets.NVIM_MIRROR_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${NVIM_MIRROR_PAT:-}" ]; then
            echo "::error::NVIM_MIRROR_PAT not accessible. Create a fine-grained PAT with contents:write on Nimblesite/basilisk.nvim and add it under Org/Repo Settings → Secrets and variables → Actions → NVIM_MIRROR_PAT (and add Basilisk to its allowed repositories)."
            exit 1
          fi
          sha="${{ steps.split.outputs.sha }}"
          mirror="https://x-access-token:${NVIM_MIRROR_PAT}@github.com/Nimblesite/basilisk.nvim.git"

          # Tag the mirror with the SAME tag as the monorepo so the plugin
          # version and the binary that binary.lua auto-downloads from
          # Nimblesite/Basilisk releases are guaranteed identical.
          git push "$mirror" "${sha}:refs/tags/${GITHUB_REF_NAME}"

          # Only stable tags advance the mirror's default branch. SemVer
          # prerelease tags (v0.1.0-alpha, -rc.1, …) contain a hyphen and ship
          # as a tag only, so `main` keeps tracking the latest stable release.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "Prerelease ${GITHUB_REF_NAME}: tagged the mirror, leaving main unchanged"
          else
            git push --force "$mirror" "${sha}:refs/heads/main"
            echo "Stable ${GITHUB_REF_NAME}: tagged the mirror and advanced main"
          fi

  publish-scoop:
    name: Publish Scoop manifest
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Render manifest and push to bucket
        env:
          BREW_SCOOP_PAT: ${{ secrets.BREW_SCOOP_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${BREW_SCOOP_PAT:-}" ]; then
            echo "::error::BREW_SCOOP_PAT not accessible. The Nimblesite org secret exists; ensure Basilisk is in its allowed repositories (Org Settings → Secrets and variables → Actions → BREW_SCOOP_PAT → Repository access)."
            exit 1
          fi

          export BASILISK_VERSION="${GITHUB_REF_NAME#v}"
          export BASILISK_BASE_URL="https://github.com/Nimblesite/Basilisk/releases/download/${GITHUB_REF_NAME}"
          BASILISK_SHA_WIN_X64="$(sha256sum artifacts/basilisk-x86_64-pc-windows-msvc.zip | awk '{print $1}')"
          BASILISK_SHA_WIN_ARM64="$(sha256sum artifacts/basilisk-aarch64-pc-windows-msvc.zip | awk '{print $1}')"
          export BASILISK_SHA_WIN_X64 BASILISK_SHA_WIN_ARM64

          git clone "https://x-access-token:${BREW_SCOOP_PAT}@github.com/Nimblesite/scoop-bucket.git" bucket
          mkdir -p bucket/bucket

          # envsubst with an explicit variable list — leaves Scoop's $version
          # autoupdate placeholder untouched and only substitutes BASILISK_*.
          envsubst '${BASILISK_VERSION} ${BASILISK_BASE_URL} ${BASILISK_SHA_WIN_X64} ${BASILISK_SHA_WIN_ARM64}' \
            < .github/release-templates/basilisk.json.tmpl \
            > bucket/bucket/basilisk.json

          # Sanity check: parse JSON to catch any template/substitution damage.
          python3 -m json.tool bucket/bucket/basilisk.json > /dev/null

          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/basilisk.json
          if git diff --cached --quiet; then
            echo "Manifest already up to date for ${BASILISK_VERSION}"
            exit 0
          fi
          git commit -m "basilisk ${BASILISK_VERSION}"
          git push

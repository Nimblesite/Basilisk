name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build binary - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: basilisk
            archive: basilisk-x86_64-unknown-linux-gnu.tar.gz
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: basilisk
            archive: basilisk-aarch64-unknown-linux-gnu.tar.gz
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-15
            binary: basilisk
            archive: basilisk-aarch64-apple-darwin.zip
          - platform: win32-x64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: basilisk.exe
            archive: basilisk-x86_64-pc-windows-msvc.zip
          - platform: win32-arm64
            target: aarch64-pc-windows-msvc
            os: windows-latest
            binary: basilisk.exe
            archive: basilisk-aarch64-pc-windows-msvc.zip

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Stamp release version
        shell: bash
        run: scripts/stamp-version.sh

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target ${{ matrix.target }} --bin basilisk
          if [[ "${{ matrix.platform }}" == darwin-* ]]; then
            cargo build --release --target ${{ matrix.target }} --bin basilisk-profiler-helper
          fi

      - name: Package macOS archive
        if: startsWith(matrix.platform, 'darwin-')
        run: |
          set -euo pipefail
          reldir="target/${{ matrix.target }}/release"
          # The release archive is the single source of truth for the VSIX job,
          # so the darwin archive must also carry the profiler helper that ships
          # inside the macOS VSIX. ditto's zip preserves the Unix executable bit;
          # Homebrew's `bin.install "basilisk"` ignores the extra helper.
          staging="basilisk-darwin"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp "$reldir/${{ matrix.binary }}" "$staging/"
          cp "$reldir/basilisk-profiler-helper" "$staging/"
          ditto -c -k --keepParent "$staging" "${{ matrix.archive }}"

      - name: Package Linux archive
        if: startsWith(matrix.platform, 'linux-')
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ matrix.binary }}

      - name: Package Windows archive
        if: startsWith(matrix.platform, 'win32-')
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}"

      # Transient in-run hand-off to the `release` job, which attaches these to
      # the GitHub Release (the only permanent, free, unlimited store). Pinned to
      # retention-days: 1 — the floor — instead of the 90-day default so build
      # outputs never accrue billed storage ([GITHUB-NO-ARTIFACTS]).
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          retention-days: 1

  release:
    name: Publish binaries to release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: basilisk-*
          merge-multiple: true

      # Create the release up front and attach the platform archives to it.
      # Every downstream job (VSIX, Homebrew, Scoop) pulls its binaries from
      # this release rather than from raw Actions artifacts, which drop the
      # Unix executable bit. Archives (tar.gz / ditto zip) preserve it.
      - name: Create release with platform binaries
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          generate_release_notes: true
          # Publish immediately — never leave the release as a draft. The action
          # defaults to draft=false, but it only WRITES the fields you give it:
          # on a re-run over a tag whose release already exists as a draft (a
          # hand-created draft, or one left by an earlier interrupted run), an
          # omitted `draft` preserves the existing draft flag and the release
          # stays hidden. Setting it explicitly forces every run to publish.
          draft: false
          # Any tag with a SemVer prerelease suffix (v0.1.0-alpha,
          # v0.1.0-beta, v0.1.0-rc.1, …) marks the GitHub release as
          # prerelease so it does not become the "Latest release".
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip

      # Defence in depth: assert the release is actually published. If anything
      # ever leaves it as a draft again, fail the run loudly here rather than
      # shipping a tag whose binaries are invisible to users and to the
      # downstream VSIX / Homebrew / Scoop jobs that download from this release.
      - name: Verify release is published (not a draft)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')"
          if [ "${is_draft}" != "false" ]; then
            echo "::error::Release ${GITHUB_REF_NAME} is a draft (isDraft=${is_draft}) — it must be published. Aborting."
            exit 1
          fi
          echo "Release ${GITHUB_REF_NAME} is published (isDraft=false)."

  vsix:
    name: VSIX - ${{ matrix.platform }}-${{ matrix.arch }}
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
            npm_config_arch: arm64
            archive: basilisk-aarch64-apple-darwin.zip
          - os: ubuntu-latest
            platform: linux
            arch: x64
            npm_config_arch: x64
            archive: basilisk-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            npm_config_arch: arm64
            cross: true
            archive: basilisk-aarch64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            platform: win32
            arch: x64
            npm_config_arch: x64
            archive: basilisk-x86_64-pc-windows-msvc.zip
          - os: windows-latest
            platform: win32
            arch: arm64
            npm_config_arch: arm64
            cross: true
            archive: basilisk-aarch64-pc-windows-msvc.zip

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Stamp release version
        shell: bash
        run: scripts/stamp-version.sh

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      # Needed to vendor debugpy (pip install --target) into the VSIX bundle.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_config_arch }}

      - name: Validate Shipwright manifest
        working-directory: vscode-extension
        run: npm run test:shipwright

      - name: Set vsce target
        shell: pwsh
        run: echo "target=${{ matrix.platform }}-${{ matrix.arch }}" >> $env:GITHUB_ENV

      # Pull the per-platform binary from the release published by the `release`
      # job — the single source of truth — instead of recompiling here. The
      # release archives preserve the Unix executable bit, so the staged binary
      # is runnable (a raw Actions-artifact hand-off would strip it -> EACCES).
      - name: Download release archive (POSIX)
        if: matrix.platform != 'win32'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf runtime-bin
          mkdir -p runtime-bin
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "${{ matrix.archive }}" --dir runtime-bin
          case "${{ matrix.archive }}" in
            *.tar.gz) tar -xzf "runtime-bin/${{ matrix.archive }}" -C runtime-bin ;;
            # ditto zips nest under a top dir; -j flattens, -o preserves perms.
            *.zip) unzip -j -o "runtime-bin/${{ matrix.archive }}" -d runtime-bin ;;
          esac

      - name: Download release archive (Windows)
        if: matrix.platform == 'win32'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -Recurse -Force runtime-bin -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path runtime-bin | Out-Null
          gh release download "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --pattern "${{ matrix.archive }}" --dir runtime-bin
          Expand-Archive -Path "runtime-bin/${{ matrix.archive }}" -DestinationPath runtime-bin -Force

      - name: Stage Shipwright manifest and runtime binaries
        shell: bash
        run: |
          set -euo pipefail
          # Stage exactly the manifest-declared bundled binaries for this target
          # via the shared stage-runtime helper — the SAME single-source staging
          # the Makefile (_release_vsix / _test_vsix) uses, so the published VSIX
          # and the e2e-tested bundle can never diverge. stage-runtime clears
          # bin/, copies each bundled binary from the extracted release archive,
          # and re-asserts the exec bit on POSIX targets (the archives already
          # carry it; Windows .exe needs no bit). Implements
          # [VSIX-PACKAGING-PARITY].
          node vscode-extension/scripts/stage-runtime.mjs runtime-bin "${{ env.target }}"
          cp shipwright.json vscode-extension/shipwright.json
          cp NOTICES vscode-extension/NOTICES

      # Skip on cross-compiled targets: the runner's CPU arch can't execute
      # the produced binary (x64 host -> aarch64 target). The VSIX contents
      # check below still runs and validates the zipped layout.
      - name: Verify runtime version contracts
        if: ${{ !matrix.cross }}
        working-directory: vscode-extension
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ matrix.platform }}" = "win32" ]; then exe=".exe"; fi
          args=("bin/${{ env.target }}/basilisk${exe}")
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            args+=("bin/${{ env.target }}/basilisk-profiler-helper")
          fi
          node scripts/verify-shipwright.mjs versions "${args[@]}"

      - name: Vendor debugpy into the VSIX bundle
        working-directory: vscode-extension
        shell: bash
        run: node scripts/vendor-debugpy.mjs

      - name: Package VSIX
        working-directory: vscode-extension
        shell: bash
        run: |
          set -euo pipefail
          # vsce refuses to publish with `--pre-release` unless the VSIX was
          # also *packaged* with `--pre-release` (it sets preRelease=true in
          # the embedded manifest). Pass it here for any SemVer prerelease tag.
          flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flag="--pre-release"
          fi
          npx vsce package $flag --target "${{ env.target }}" --ignore-other-target-folders --out "basilisk-${{ env.target }}.vsix"

      - name: Verify VSIX contents
        working-directory: vscode-extension
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ matrix.platform }}" = "win32" ]; then exe=".exe"; fi
          unzip -l "basilisk-${{ env.target }}.vsix" | grep -F "bin/${{ env.target }}/basilisk${exe}"
          unzip -l "basilisk-${{ env.target }}.vsix" | grep -F "shipwright.json"
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            unzip -l "basilisk-${{ env.target }}.vsix" | grep -F "bin/${{ env.target }}/basilisk-profiler-helper"
          fi
          node scripts/verify-shipwright.mjs vsix "basilisk-${{ env.target }}.vsix" "${{ env.target }}"

      # Transient in-run hand-off to `release-assets`, which uploads the VSIX to
      # the GitHub Release (permanent, free). retention-days: 1 (the floor) keeps
      # build output out of billed storage ([GITHUB-NO-ARTIFACTS]).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.target }}
          path: vscode-extension/*.vsix
          retention-days: 1

  release-assets:
    name: Attach VSIX + checksums to release
    needs: vsix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          # Flatten every upload (archives + per-platform VSIXes) into one dir.
          # Each upload's `name:` is the file itself, so merge-multiple yields
          # the bare files side by side for checksumming.
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum ./*.tar.gz ./*.zip ./*.vsix > checksums-sha256.txt

      # Attach the VSIXes and the full checksum manifest to the release the
      # `release` job already created with the platform archives.
      - name: Upload VSIX and checksums to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber \
            artifacts/*.vsix artifacts/checksums-sha256.txt

  publish-vsix:
    name: Publish VSIX
    needs: vsix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: success() && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Publish to VS Code Marketplace
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCODE_MARKETPLACE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::error::VSCODE_MARKETPLACE_PAT not accessible. If it exists at the Nimblesite org level, add Basilisk to its allowed repositories under Org Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Tags like v0.1.0-alpha / v0.1.0-beta / v0.1.0-rc.1 are prerelease.
          # Plain vX.Y.Z is a stable release. Marketplace requires the
          # --pre-release flag for any SemVer prerelease suffix; without it,
          # vsce rejects the publish.
          flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flag="--pre-release"
            echo "Detected prerelease tag ${GITHUB_REF_NAME}; publishing with --pre-release"
          else
            echo "Detected stable tag ${GITHUB_REF_NAME}; publishing to stable channel"
          fi
          # One publish per platform-specific VSIX. vsce requires a separate
          # publish call for each --target platform; globbing all into one
          # publish silently uses only the first.
          shopt -s globstar nullglob
          published=0
          for vsix in **/*.vsix; do
            echo "Publishing $vsix"
            npx --yes @vscode/vsce publish $flag --packagePath "$vsix"
            published=$((published + 1))
          done
          if [ "$published" -eq 0 ]; then
            echo "::error::No VSIX artifacts found to publish"
            exit 1
          fi
          echo "Published $published VSIX(es) to the Marketplace"

  publish-vsix-ovsx:
    name: Publish VSIX (Open VSX)
    needs: vsix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Independent of publish-vsix: the Open VSX push (which serves the VS Code
    # forks — Cursor, Windsurf, Antigravity) must not be gated on the MS
    # Marketplace publish, and vice versa.
    if: success() && startsWith(github.ref, 'refs/tags/')
    # Least privilege: this job only downloads same-run artifacts and pushes to
    # an external registry. Drop the inherited `contents: write` to read-only;
    # `actions: read` is all download-artifact@v4 needs for same-run artifacts.
    # Open VSX has no OIDC/trusted-publishing path, so no `id-token` is granted.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Publish to Open VSX Registry
        shell: bash
        # The token is exposed only as an env var, never on the command line:
        # ovsx reads OVSX_PAT automatically when -p is omitted, keeping the
        # secret out of the process argv (where `ps` or a leaked dump could
        # read it). GitHub masks it in logs; this closes the argv vector too.
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::error::OPEN_VSX_PAT not accessible. The Nimblesite org secret exists; add Basilisk to its allowed repositories under Org Settings → Secrets and variables → Actions → OPEN_VSX_PAT → Repository access."
            exit 1
          fi
          # Mirrors the Marketplace prerelease rule: a hyphenated SemVer tag
          # (v0.1.0-alpha, v0.1.0-rc.1, …) is a prerelease. ovsx, like vsce,
          # only accepts --pre-release on a VSIX that was packaged as such —
          # the `vsix` job already bakes that in, so the flags stay aligned.
          flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flag="--pre-release"
            echo "Detected prerelease tag ${GITHUB_REF_NAME}; publishing with --pre-release"
          else
            echo "Detected stable tag ${GITHUB_REF_NAME}; publishing to stable channel"
          fi
          # One publish per platform-specific VSIX. The target is baked into
          # each VSIX, so no --target flag is needed, but each must be pushed
          # separately — a single glob would publish only the first.
          # ovsx is version-pinned: a floating `npx ovsx` would fetch and run
          # the latest release at publish time, inside the job that holds the
          # token — a supply-chain risk. Bump deliberately.
          shopt -s globstar nullglob
          published=0
          for vsix in **/*.vsix; do
            echo "Publishing $vsix"
            npx --yes ovsx@1.0.0 publish $flag --packagePath "$vsix"
            published=$((published + 1))
          done
          if [ "$published" -eq 0 ]; then
            echo "::error::No VSIX artifacts found to publish"
            exit 1
          fi
          echo "Published $published VSIX(es) to Open VSX"

  deploy-pages:
    name: Deploy GitHub Pages
    needs: release-assets
    # Only stable releases update the live site. SemVer prerelease tags
    # (v0.1.0-alpha, v0.1.0-rc.1, …) contain a hyphen and are skipped.
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml

  publish-homebrew:
    name: Publish Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Auth for the tap push: actions/checkout configures the PAT as an HTTP
      # extraheader, which GitHub accepts. A hand-rolled
      # `git clone https://x-access-token:$PAT@github.com/...` is rejected
      # ("Invalid username or token. Password authentication is not supported").
      - name: Checkout homebrew-tap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Nimblesite/homebrew-tap
          token: ${{ secrets.BREW_SCOOP_PAT }}
          path: tap

      # Pull the macOS + Linux archives straight from the release so the
      # checksums in the formula match exactly what users download.
      - name: Download release archives
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir artifacts \
            --pattern "basilisk-aarch64-apple-darwin.zip" \
            --pattern "basilisk-x86_64-unknown-linux-gnu.tar.gz" \
            --pattern "basilisk-aarch64-unknown-linux-gnu.tar.gz"

      - name: Render formula and push to tap
        run: |
          set -euo pipefail
          export BASILISK_VERSION="${GITHUB_REF_NAME#v}"
          export BASILISK_BASE_URL="https://github.com/Nimblesite/Basilisk/releases/download/${GITHUB_REF_NAME}"
          BASILISK_SHA_DARWIN_ARM64="$(sha256sum artifacts/basilisk-aarch64-apple-darwin.zip | awk '{print $1}')"
          BASILISK_SHA_LINUX_X86_64="$(sha256sum artifacts/basilisk-x86_64-unknown-linux-gnu.tar.gz | awk '{print $1}')"
          BASILISK_SHA_LINUX_AARCH64="$(sha256sum artifacts/basilisk-aarch64-unknown-linux-gnu.tar.gz | awk '{print $1}')"
          export BASILISK_SHA_DARWIN_ARM64 BASILISK_SHA_LINUX_X86_64 BASILISK_SHA_LINUX_AARCH64

          mkdir -p tap/Formula

          # envsubst with an explicit variable list — leaves Ruby's #{...}
          # interpolation untouched and only substitutes BASILISK_*.
          envsubst '${BASILISK_VERSION} ${BASILISK_BASE_URL} ${BASILISK_SHA_DARWIN_ARM64} ${BASILISK_SHA_LINUX_X86_64} ${BASILISK_SHA_LINUX_AARCH64}' \
            < .github/release-templates/basilisk.rb.tmpl \
            > tap/Formula/basilisk.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/basilisk.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${BASILISK_VERSION}"
            exit 0
          fi
          git commit -m "basilisk ${BASILISK_VERSION}"
          git push

  publish-nvim:
    name: Publish Neovim plugin
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Render plugin tree and push to the basilisk.nvim mirror
        # Same write convention as publish-homebrew/publish-scoop: clone the
        # sibling Nimblesite/* repo with the x-access-token credential, replace
        # its content, then commit as github-actions[bot] and push. Neovim
        # plugin managers (and vim.pack) can only install a repo whose root *is*
        # the plugin, so the mirror's root is the basilisk.nvim/ tree. The PAT
        # must be able to write to Nimblesite/basilisk.nvim (add it to the
        # token's allowed repositories if it is fine-grained).
        env:
          BREW_SCOOP_PAT: ${{ secrets.BREW_SCOOP_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${BREW_SCOOP_PAT:-}" ]; then
            echo "::error::BREW_SCOOP_PAT not accessible. The Nimblesite org secret exists; ensure Basilisk is in its allowed repositories AND that the token can write to Nimblesite/basilisk.nvim (Org Settings → Secrets and variables → Actions → BREW_SCOOP_PAT → Repository access)."
            exit 1
          fi

          export BASILISK_VERSION="${GITHUB_REF_NAME#v}"

          git clone "https://x-access-token:${BREW_SCOOP_PAT}@github.com/Nimblesite/basilisk.nvim.git" mirror

          # Replace the mirror's tracked content with the current basilisk.nvim/
          # tree, preserving the mirror's own .git directory.
          find mirror -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R basilisk.nvim/. mirror/

          cd mirror
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "basilisk.nvim already up to date for ${BASILISK_VERSION}"
          else
            git commit -m "basilisk ${BASILISK_VERSION}"
            git push
          fi

          # Tag the mirror with the SAME tag as the monorepo so the plugin
          # version and the binary that binary.lua auto-downloads from
          # Nimblesite/Basilisk releases stay identical, and version-pinned
          # installs (vim.pack / lazy.nvim) resolve. Unlike the Homebrew formula
          # and Scoop manifest, plugins are versioned by git tag, so this step
          # is nvim-specific. Idempotent: skip if the tag already exists.
          if git ls-remote --exit-code --tags origin "refs/tags/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Tag ${GITHUB_REF_NAME} already present on the mirror"
          else
            git tag "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}"
          fi

  publish-scoop:
    name: Publish Scoop manifest
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Auth for the bucket push: see note in publish-homebrew. Use
      # actions/checkout's token handling, not a URL-embedded PAT.
      - name: Checkout scoop-bucket
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Nimblesite/scoop-bucket
          token: ${{ secrets.BREW_SCOOP_PAT }}
          path: bucket

      # Pull the Windows archives straight from the release so the checksums in
      # the manifest match exactly what users download.
      - name: Download release archives
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir artifacts \
            --pattern "basilisk-x86_64-pc-windows-msvc.zip" \
            --pattern "basilisk-aarch64-pc-windows-msvc.zip"

      - name: Render manifest and push to bucket
        run: |
          set -euo pipefail
          export BASILISK_VERSION="${GITHUB_REF_NAME#v}"
          export BASILISK_BASE_URL="https://github.com/Nimblesite/Basilisk/releases/download/${GITHUB_REF_NAME}"
          BASILISK_SHA_WIN_X64="$(sha256sum artifacts/basilisk-x86_64-pc-windows-msvc.zip | awk '{print $1}')"
          BASILISK_SHA_WIN_ARM64="$(sha256sum artifacts/basilisk-aarch64-pc-windows-msvc.zip | awk '{print $1}')"
          export BASILISK_SHA_WIN_X64 BASILISK_SHA_WIN_ARM64

          mkdir -p bucket/bucket

          # envsubst with an explicit variable list — leaves Scoop's $version
          # autoupdate placeholder untouched and only substitutes BASILISK_*.
          envsubst '${BASILISK_VERSION} ${BASILISK_BASE_URL} ${BASILISK_SHA_WIN_X64} ${BASILISK_SHA_WIN_ARM64}' \
            < .github/release-templates/basilisk.json.tmpl \
            > bucket/bucket/basilisk.json

          # Sanity check: parse JSON to catch any template/substitution damage.
          python3 -m json.tool bucket/bucket/basilisk.json > /dev/null

          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/basilisk.json
          if git diff --cached --quiet; then
            echo "Manifest already up to date for ${BASILISK_VERSION}"
            exit 0
          fi
          git commit -m "basilisk ${BASILISK_VERSION}"
          git push

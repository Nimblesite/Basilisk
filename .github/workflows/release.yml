name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build binary - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: basilisk
            archive: basilisk-x86_64-unknown-linux-gnu.tar.gz
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: basilisk
            archive: basilisk-aarch64-unknown-linux-gnu.tar.gz
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-15
            binary: basilisk
            archive: basilisk-aarch64-apple-darwin.zip
          - platform: win32-x64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: basilisk.exe
            archive: basilisk-x86_64-pc-windows-msvc.zip
          - platform: win32-arm64
            target: aarch64-pc-windows-msvc
            os: windows-latest
            binary: basilisk.exe
            archive: basilisk-aarch64-pc-windows-msvc.zip

    steps:
      - uses: actions/checkout@v4

      - name: Stamp release version
        shell: bash
        run: scripts/stamp-version.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin basilisk

      # ── macOS signing + notarization (disabled for alpha) ────────────────
      # Re-enable once APPLE_DEVELOPER_ID_CERT_P12, APPLE_DEVELOPER_ID_CERT_PASSWORD,
      # NOTARIZATION_API_KEY_P8, NOTARIZATION_KEY_ID, NOTARIZATION_ISSUER_ID
      # are configured. Until then, ship the raw unsigned binary; Gatekeeper
      # will require users to right-click → Open the first time.
      #
      # - name: Import Developer ID certificate
      #   if: startsWith(matrix.platform, 'darwin-')
      #   run: |
      #     echo "$APPLE_DEVELOPER_ID_CERT_P12" | base64 --decode > cert.p12
      #     security create-keychain -p "" build.keychain
      #     security default-keychain -s build.keychain
      #     security unlock-keychain -p "" build.keychain
      #     security import cert.p12 -k build.keychain -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
      #     identity="$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
      #     test -n "$identity"
      #     echo "APPLE_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      #   env:
      #     APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
      #     APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
      #
      # - name: Decode notarization API key
      #   if: startsWith(matrix.platform, 'darwin-')
      #   run: echo "$NOTARIZATION_API_KEY_P8" | base64 --decode > AuthKey.p8
      #   env:
      #     NOTARIZATION_API_KEY_P8: ${{ secrets.NOTARIZATION_API_KEY_P8 }}
      #
      # - name: Sign, notarize, and staple macOS binary archive
      #   if: startsWith(matrix.platform, 'darwin-')
      #   run: |
      #     set -euo pipefail
      #     binary_path="target/${{ matrix.target }}/release/${{ matrix.binary }}"
      #     codesign --sign "$APPLE_CODESIGN_IDENTITY" --options runtime --timestamp --force "$binary_path"
      #     codesign --verify --strict --verbose=4 "$binary_path"
      #     ditto -c -k --keepParent "$binary_path" "${{ matrix.archive }}"
      #     xcrun notarytool submit "${{ matrix.archive }}" \
      #       --key AuthKey.p8 \
      #       --key-id "$NOTARIZATION_KEY_ID" \
      #       --issuer "$NOTARIZATION_ISSUER_ID" \
      #       --wait
      #     xcrun stapler staple "${{ matrix.archive }}"
      #     xcrun stapler validate "${{ matrix.archive }}"
      #     spctl --assess --verbose --type execute "$binary_path"
      #   env:
      #     NOTARIZATION_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
      #     NOTARIZATION_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}

      - name: Package macOS archive
        if: startsWith(matrix.platform, 'darwin-')
        run: |
          set -euo pipefail
          binary_path="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          ditto -c -k --keepParent "$binary_path" "${{ matrix.archive }}"

      - name: Package Linux archive
        if: startsWith(matrix.platform, 'linux-')
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ matrix.binary }}

      - name: Package Windows archive
        if: startsWith(matrix.platform, 'win32-')
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  vsix:
    name: VSIX - ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
            rust_target: aarch64-apple-darwin
            npm_config_arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            npm_config_arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            npm_config_arch: arm64
            cross: true
          - os: windows-latest
            platform: win32
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            npm_config_arch: x64
          - os: windows-latest
            platform: win32
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
            npm_config_arch: arm64
            cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Stamp release version
        shell: bash
        run: scripts/stamp-version.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install cross-compilation tools
        if: matrix.rust_target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: vsix-${{ matrix.rust_target }}
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_config_arch }}

      - name: Validate Shipwright manifest
        working-directory: vscode-extension
        run: npm run test:shipwright

      - name: Build VSIX runtime binaries
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.rust_target }} --bin basilisk
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            cargo build --release --target ${{ matrix.rust_target }} --bin basilisk-profiler-helper
          fi

      # ── macOS VSIX signing (disabled for alpha) ──────────────────────────
      # Re-enable alongside the build-job signing block once Apple secrets
      # are configured. For alpha, VSIX bundles the raw unsigned binary.
      #
      # - name: Import Developer ID certificate
      #   if: matrix.platform == 'darwin'
      #   run: |
      #     echo "$APPLE_DEVELOPER_ID_CERT_P12" | base64 --decode > cert.p12
      #     security create-keychain -p "" build.keychain
      #     security default-keychain -s build.keychain
      #     security unlock-keychain -p "" build.keychain
      #     security import cert.p12 -k build.keychain -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
      #     identity="$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
      #     test -n "$identity"
      #     echo "APPLE_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      #   env:
      #     APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
      #     APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
      #
      # - name: Sign macOS VSIX binaries
      #   if: matrix.platform == 'darwin'
      #   run: |
      #     set -euo pipefail
      #     codesign --sign "$APPLE_CODESIGN_IDENTITY" --options runtime --timestamp --force "target/${{ matrix.rust_target }}/release/basilisk"
      #     codesign --sign "$APPLE_CODESIGN_IDENTITY" --options runtime --timestamp --force "target/${{ matrix.rust_target }}/release/basilisk-profiler-helper"
      #     codesign --verify --strict --verbose=4 "target/${{ matrix.rust_target }}/release/basilisk"
      #     codesign --verify --strict --verbose=4 "target/${{ matrix.rust_target }}/release/basilisk-profiler-helper"

      - name: Set vsce target
        shell: pwsh
        run: echo "target=${{ matrix.platform }}-${{ matrix.arch }}" >> $env:GITHUB_ENV

      - name: Stage Shipwright manifest and runtime binaries
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ matrix.platform }}" = "win32" ]; then exe=".exe"; fi
          rm -rf vscode-extension/bin
          mkdir -p "vscode-extension/bin/${{ env.target }}"
          cp "target/${{ matrix.rust_target }}/release/basilisk${exe}" "vscode-extension/bin/${{ env.target }}/"
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            cp "target/${{ matrix.rust_target }}/release/basilisk-profiler-helper" "vscode-extension/bin/${{ env.target }}/"
          fi
          cp shipwright.json vscode-extension/shipwright.json

      # Skip on cross-compiled targets: the runner's CPU arch can't execute
      # the produced binary (x64 host -> aarch64 target). The VSIX contents
      # check below still runs and validates the zipped layout.
      - name: Verify runtime version contracts
        if: ${{ !matrix.cross }}
        working-directory: vscode-extension
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ matrix.platform }}" = "win32" ]; then exe=".exe"; fi
          args=("bin/${{ env.target }}/basilisk${exe}")
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            args+=("bin/${{ env.target }}/basilisk-profiler-helper")
          fi
          node scripts/verify-shipwright.mjs versions "${args[@]}"

      - name: Package VSIX
        working-directory: vscode-extension
        shell: bash
        run: |
          set -euo pipefail
          # vsce refuses to publish with `--pre-release` unless the VSIX was
          # also *packaged* with `--pre-release` (it sets preRelease=true in
          # the embedded manifest). Pass it here for any SemVer prerelease tag.
          flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flag="--pre-release"
          fi
          npx vsce package $flag --target "${{ env.target }}" --ignore-other-target-folders --out "basilisk-${{ env.target }}.vsix"

      - name: Verify VSIX contents
        working-directory: vscode-extension
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ matrix.platform }}" = "win32" ]; then exe=".exe"; fi
          unzip -l "basilisk-${{ env.target }}.vsix" | grep -F "bin/${{ env.target }}/basilisk${exe}"
          unzip -l "basilisk-${{ env.target }}.vsix" | grep -F "shipwright.json"
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            unzip -l "basilisk-${{ env.target }}.vsix" | grep -F "bin/${{ env.target }}/basilisk-profiler-helper"
          fi
          node scripts/verify-shipwright.mjs vsix "basilisk-${{ env.target }}.vsix" "${{ env.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.target }}
          path: vscode-extension/*.vsix

  publish-vsix:
    name: Publish VSIX
    needs: vsix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: success() && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4

      - name: Publish to VS Code Marketplace
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCODE_MARKETPLACE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::error::VSCODE_MARKETPLACE_PAT not accessible. If it exists at the Nimblesite org level, add Basilisk to its allowed repositories under Org Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Tags like v0.1.0-alpha / v0.1.0-beta / v0.1.0-rc.1 are prerelease.
          # Plain vX.Y.Z is a stable release. Marketplace requires the
          # --pre-release flag for any SemVer prerelease suffix; without it,
          # vsce rejects the publish.
          flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flag="--pre-release"
            echo "Detected prerelease tag ${GITHUB_REF_NAME}; publishing with --pre-release"
          else
            echo "Detected stable tag ${GITHUB_REF_NAME}; publishing to stable channel"
          fi
          # One publish per platform-specific VSIX. vsce requires a separate
          # publish call for each --target platform; globbing all into one
          # publish silently uses only the first.
          shopt -s globstar nullglob
          published=0
          for vsix in **/*.vsix; do
            echo "Publishing $vsix"
            npx --yes @vscode/vsce publish $flag --packagePath "$vsix"
            published=$((published + 1))
          done
          if [ "$published" -eq 0 ]; then
            echo "::error::No VSIX artifacts found to publish"
            exit 1
          fi
          echo "Published $published VSIX(es) to the Marketplace"

  github-release:
    name: Create GitHub Release
    needs: [build, vsix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Flatten: each upload's `name:` is the file itself, so without
          # merging, download-artifact@v4 creates artifacts/<file>/<file>
          # — `mv *.tar.gz artifacts/` then collides with the directory.
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz *.zip *.vsix > checksums-sha256.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Any tag with a SemVer prerelease suffix (v0.1.0-alpha,
          # v0.1.0-beta, v0.1.0-rc.1, …) marks the GitHub release as
          # prerelease so it does not become the "Latest release".
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.vsix
            artifacts/checksums-sha256.txt

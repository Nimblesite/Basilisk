name: Deploy GitHub Pages

on:
  workflow_dispatch:
  # Auto-deploy when a stable GitHub Release is published by release.yml.
  # Prereleases (v*-alpha, v*-beta, v*-rc.*) are skipped via the job-level
  # `if` below — release.yml flags them via `prerelease: true` on the
  # release payload.
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build site
        working-directory: website
        run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

      - uses: actions/deploy-pages@v4
        id: deploy

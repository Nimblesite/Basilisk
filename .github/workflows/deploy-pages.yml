name: Deploy GitHub Pages

# A RELEASE is the only thing that publishes this site. There is DELIBERATELY no
# `push:` trigger — a merge to `main` must NOT deploy, and adding one back is a
# regression, not a convenience.
#
# Why: the site is not static data. The playground embeds the checker itself,
# compiled to WebAssembly at build time ([WASM-BUILD]), and the docs quote the
# conformance score and the released binary's behaviour. Publishing on merge
# would put an UNRELEASED checker in front of users — the playground would
# answer differently from the `basilisk` anyone can install, and the docs would
# describe a version that does not exist yet. Deploying only on release keeps
# the site in lockstep with the binary it documents.
#
# A change merged to `main` is verified pre-merge by ci.yml's `Website Build`
# job (same build, same playground e2e) and ships with the next release.
on:
  # Called by release.yml after a stable GitHub Release is created. A release
  # created with the default GITHUB_TOKEN does not emit a `release: published`
  # event that can start another workflow, so the release pipeline invokes this
  # one directly instead of relying on that event.
  workflow_call:
  # Manual escape hatch for an out-of-band site fix between releases (a typo, a
  # dead link). Deliberately a human decision — never automatic.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # 20, not 10: `npm run build` now compiles the checker to WebAssembly for
    # the playground ([WASM-BUILD]) before Eleventy runs. Kept in step with the
    # same budget in ci.yml's website job.
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # fetch-depth: 0 — the conformance over-time chart (_data/conformance.js)
      # reads the full git history of conformance/conformance_status.csv. A
      # shallow clone would collapse the chart to a single point.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: website/package-lock.json

      # The playground engine is the real checker compiled to wasm32, built by
      # `npm run build:wasm` ([WASM-BUILD]). Without this the deployed site
      # would serve a playground page whose engine never loads.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          prefix-key: v1-rust-glibc

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build site
        working-directory: website
        # GITHUB_TOKEN raises the GitHub API rate limit for _data/releases.js
        # (the releases page is generated from the live Releases API at build
        # time); the build still degrades gracefully if the call fails.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/_site

      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deploy

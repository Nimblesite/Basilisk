name: Deploy GitHub Pages

# The site is one statement plus a notice at every retired URL
# ([WITHDRAWAL-SURFACES]). It publishes on merge to `main`.
#
# This used to deploy on release ONLY, because the site was coupled to the
# binary: the playground embedded the checker compiled to wasm, and the docs
# quoted the conformance score, so publishing on merge would have put an
# unreleased checker in front of users. None of that is left — there is no
# playground, no score, no documentation of a shipped version, and there will be
# no further release to ride along with. Holding the withdrawal notice back
# until a release that is not coming would leave the old marketing live.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/specs/DOCS-WITHDRAWAL-MESSAGING-SPEC.md"
      - ".github/workflows/deploy-pages.yml"
  # Still callable by release.yml, which invokes this workflow directly.
  workflow_call:
  # Manual escape hatch for an out-of-band fix. Deliberately a human decision.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # The site is templates and one generated data file — no Rust, no wasm, no
    # git history. Kept in step with ci.yml's website job.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      # Every word the site publishes is extracted from the messaging spec
      # ([WITHDRAWAL-COPY]). Deploy must not be able to ship copy the spec does
      # not contain, so the drift gate runs here too — not only pre-merge.
      - name: Check site copy is in sync with the messaging spec
        run: python3 scripts/gen_withdrawal_copy.py --check

      - name: Build site
        working-directory: website
        run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/_site

      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deploy

name: Deploy GitHub Pages

on:
  workflow_dispatch:
  # Called by release.yml after a stable GitHub Release is created. A release
  # created with the default GITHUB_TOKEN does not emit a `release: published`
  # event that can start another workflow, so the release pipeline invokes this
  # one directly instead of relying on that event.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build site
        working-directory: website
        run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

      - uses: actions/deploy-pages@v4
        id: deploy

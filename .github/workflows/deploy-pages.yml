name: Deploy GitHub Pages

on:
  workflow_dispatch:
  # Called by release.yml after a stable GitHub Release is created. A release
  # created with the default GITHUB_TOKEN does not emit a `release: published`
  # event that can start another workflow, so the release pipeline invokes this
  # one directly instead of relying on that event.
  workflow_call:
  # Website + benchmark content is pure static-site data — it never touches the
  # Rust toolchain or the published binaries. Deploy it straight from `main` on
  # merge so a docs/benchmark refresh goes live WITHOUT cutting a binary release
  # (release.yml builds 5 platforms + VSIX + marketplace publishes — all wasted
  # work for a site change). A real release still redeploys via workflow_call.
  push:
    branches: [main]
    paths:
      - "website/**"
      - "benchmarks/status/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # fetch-depth: 0 — the conformance over-time chart (_data/conformance.js)
      # reads the full git history of conformance/conformance_status.csv. A
      # shallow clone would collapse the chart to a single point.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build site
        working-directory: website
        # GITHUB_TOKEN raises the GitHub API rate limit for _data/releases.js
        # (the releases page is generated from the live Releases API at build
        # time); the build still degrades gracefully if the call fails.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/_site

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy

name: Neovim Plugin Tests

on:
  push:
    paths:
      - "basilisk.nvim/**"
  pull_request:
    paths:
      - "basilisk.nvim/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: ["v0.10.4", "v0.11.0", "nightly"]
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Cache plenary.nvim
        uses: actions/cache@v4
        with:
          path: /tmp/plenary.nvim
          key: plenary-${{ hashFiles('.github/workflows/neovim.yml') }}

      - name: Clone plenary.nvim
        run: |
          if [ ! -d /tmp/plenary.nvim ]; then
            git clone --depth 1 https://github.com/nvim-lua/plenary.nvim /tmp/plenary.nvim
          fi

      - name: Run tests
        working-directory: basilisk.nvim
        run: |
          nvim --headless -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests/basilisk {minimal_init = 'tests/minimal_init.lua'}"
          nvim --headless -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests/ui {minimal_init = 'tests/minimal_init.lua'}"

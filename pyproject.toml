# PyPI packaging for the `basilisk` type checker.
#
# This wraps the SAME native `basilisk` binary that ships via GitHub Releases,
# Homebrew and Scoop into a Python wheel, so `pip install basilisk-python`
# lands the executable on PATH. It exists so tools that manage type checkers
# through Python environments — notably the `python/typing` conformance suite,
# which installs every checker with `uv sync` — can pull Basilisk the same way
# they pull ty, pyrefly and zuban (all Rust binaries shipped as wheels).
#
# The distribution name is `basilisk-python` because `basilisk` is already
# taken on PyPI; the installed console script is still `basilisk`.
#
# Version is single-sourced from the Cargo workspace (`dynamic = ["version"]`
# reads `crates/basilisk-cli/Cargo.toml`), which `scripts/stamp-version.sh`
# stamps at release time alongside every other versioned artifact — so the
# wheel version, the binary's `--version`, and the GitHub Release tag can never
# drift apart.
[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "basilisk-python"
description = "Basilisk is unlisted. Its type checker produced incorrect results, and the product is being rebuilt from scratch."
readme = "README-pypi.md"
requires-python = ">=3.8"
license = "Apache-2.0 AND BSD-2-Clause AND BSD-3-Clause AND CDDL-1.0 AND CDLA-Permissive-2.0 AND ISC AND MIT AND MPL-2.0 AND Unicode-3.0 AND Unicode-DFS-2016 AND Zlib"
# PEP 639 applies this expression to the containing wheel. It therefore covers
# Basilisk's MIT code, the Apache-2.0/MIT Typeshed snapshot, and every license
# selected for the statically linked runtime recorded in NOTICES. Release builds
# replace this macOS expression with the target's locked expression. The exact
# legal files travel in `.dist-info/licenses/` rather than relying on defaults.
license-files = ["LICENSE", "NOTICES", "THIRD-PARTY-LICENSES", "RUST-DEPENDENCY-LICENSES"]
authors = [{ name = "Nimblesite", email = "cftools@nimblesite.co" }]
dynamic = ["version"]
keywords = ["basilisk"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://www.basilisk-python.dev"
Repository = "https://github.com/Nimblesite/Basilisk"
Documentation = "https://www.basilisk-python.dev/docs/"
Changelog = "https://github.com/Nimblesite/Basilisk/releases"

# `bindings = "bin"` packages the compiled `basilisk` executable (from the
# basilisk-cli crate) into the wheel's scripts directory — a binary-only wheel
# with no Python extension module, so it works on any CPython/PyPy 3.x.
[tool.maturin]
bindings = "bin"
manifest-path = "crates/basilisk-cli/Cargo.toml"
strip = true

[tool.basilisk]
typeshed-commit = "83c2518a9e6abbda0c44592c3483de459198f887"

[tool.basilisk.rules]
BSK-0001 = "error"
BSK-0002 = "error"
BSK-0003 = "error"
BSK-0004 = "error"
BSK-0005 = "error"
BSK-0025 = "error"
BSK-0063 = "error"
BSK-0152 = "error"
BSK-0060 = "info"
BSK-0011 = "warning"
BSK-0012 = "warning"
BSK-0013 = "warning"
BSK-0014 = "warning"
BSK-0040 = "warning"
BSK-0050 = "warning"
BSK-0061 = "warning"
BSK-0062 = "warning"


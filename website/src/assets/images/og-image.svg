<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Basilisk Python type checker and language server</title>
  <desc id="description">Basilisk type checking, measured: a perfect official typing-suite score and a published cold-check benchmark.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1218"/>
      <stop offset="1" stop-color="#080a0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.1" cy="0.05" r="0.85">
      <stop offset="0" stop-color="#e8500a" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#e8500a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#252d3f" stroke-opacity="0.38" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#surface)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="54" y="54" width="1092" height="522" rx="22" fill="#0a0c12" fill-opacity="0.82" stroke="#252d3f" stroke-width="2"/>
  <rect x="54" y="54" width="8" height="522" rx="4" fill="#e8500a"/>

  <image href="favicon.png" x="98" y="94" width="68" height="68"/>
  <text x="184" y="141" fill="#f0f2f7" font-family="Space Grotesk, system-ui, sans-serif" font-size="38" font-weight="700" letter-spacing="-1">basilisk</text>
  <text x="1040" y="134" fill="#8892a4" font-family="JetBrains Mono, monospace" font-size="18" text-anchor="end">built in Rust</text>

  <text x="104" y="270" fill="#f0f2f7" font-family="Space Grotesk, system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-2.5">Python type checking,</text>
  <text x="104" y="344" fill="#e8500a" font-family="Space Grotesk, system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-2.5">measured.</text>

  <rect x="104" y="397" width="450" height="58" rx="10" fill="#141820" stroke="#252d3f"/>
  <circle cx="136" cy="426" r="7" fill="#34d399"/>
  <text x="158" y="434" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="21">100% official typing suite</text>

  <rect x="576" y="397" width="482" height="58" rx="10" fill="#141820" stroke="#252d3f"/>
  <circle cx="608" cy="426" r="7" fill="#60a5fa"/>
  <text x="630" y="434" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="21">Published cold-check benchmark</text>

  <text x="104" y="521" fill="#8892a4" font-family="Space Grotesk, system-ui, sans-serif" font-size="25">Open-source type checker + language server</text>
  <text x="1096" y="521" fill="#8892a4" font-family="JetBrains Mono, monospace" font-size="20" text-anchor="end">basilisk-python.dev</text>
</svg>

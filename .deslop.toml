# agent-pmo:f87d349
# Deslop duplication gate — REPO-STANDARDS-SPEC [CI-DESLOP]
# Single source of truth for this repo's duplication budget. Committed, PR-reviewed,
# ratcheted DOWN only (never up without written justification).
# `make lint` (and therefore `make ci` and CI) runs `deslop .`, which reads this
# file and exits non-zero (tanking the build) when measured repo-wide duplication
# exceeds the value below.
# Docs: https://deslop.live/docs/for-ai/
[threshold]
# Measured repo-wide duplication at stamp time: 12.5%. Ceiling set just above to
# absorb cross-runner float jitter. Ratchet DOWN as duplication is reduced.
max_duplication_percent = 12.6

[defaults]
# `exclude` drops files during discovery so they are never analysed and never
# count toward the duplication metric (per https://deslop.live/docs/for-ai/).
# Built-in defaults already cover node_modules/target/dist/__pycache__ and any
# path containing "generated"; we add only project-specific patterns on top.
exclude = [
  "benchmarks/fixtures/**",
  "crates/*/tests/**",
  # Demo / sample / illustrative code — every `examples/` dir at any depth
  # (top-level examples/, scripts/examples/, any crate-level examples/).
  # This code is deliberately illustrative and repetitive, not product source,
  # so its duplication is expected and must not gate the build.
  "**/examples/**",
  # Vendored Python dependencies — the conformance scorer's virtualenv. Third-
  # party site-packages, not our source; their internal duplication is irrelevant.
  ".venv/**",
  "**/.venv/**",
  "**/site-packages/**",
  # Throwaway working area (git-ignored). Logs, screenshots, and scratch clones
  # of upstream repos live here; never product source.
  "scratchpad/**",
  "**/scratchpad/**",
  # Upstream python/typing conformance test suite — sha-pinned third-party
  # fixtures downloaded by score.py, not our code. Duplication among the spec's
  # own test files is expected and must not gate our build (mirrors the
  # crates/*/tests and benchmarks/fixtures exclusions above).
  "conformance/tests/**",
]

[package]
name        = "basilisk-lsp"
description = "Language Server Protocol implementation for Basilisk (Phase 2+)"
version.workspace    = true
edition.workspace    = true
license.workspace    = true

[dependencies]
basilisk-parser.workspace   = true
basilisk-resolver.workspace = true
basilisk-checker.workspace  = true

tower-lsp         = "0.20"
tokio             = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net"] }
tokio-tungstenite = "0.24"
futures-util      = "0.3"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
dashmap           = "6"

[dev-dependencies]
tokio-tungstenite = "0.24"
futures-util      = "0.3"
tokio             = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
serde_json        = "1"

[lints]
workspace = true

[package]
name        = "basilisk-lsp"
description = "Language Server Protocol implementation for Basilisk (Phase 2+)"
version.workspace    = true
edition.workspace    = true
license.workspace    = true

[dependencies]
basilisk-config.workspace   = true
basilisk-parser.workspace   = true
basilisk-resolver.workspace = true
basilisk-checker.workspace  = true
basilisk-common.workspace   = true
basilisk-uv.workspace       = true
basilisk-stubs.workspace    = true

tower-lsp         = "0.20"
tokio             = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "time", "process", "fs"] }
tokio-tungstenite = "0.24"
futures-util      = "0.3"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
dashmap           = "6"
tracing.workspace = true
py-spy            = "0.4"
inferno           = { version = "0.12", default-features = false }
sysinfo           = { version = "0.39.3", default-features = false, features = ["system", "user"] }

[dev-dependencies]
tokio-tungstenite   = "0.24"
futures-util        = "0.3"
tokio               = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
serde_json          = "1"
basilisk-test-utils = { workspace = true }

[lints]
workspace = true

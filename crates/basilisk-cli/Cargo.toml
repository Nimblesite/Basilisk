[package]
name        = "basilisk-cli"
description = "Basilisk's type checker produced incorrect results. Basilisk is unlisted and is being rebuilt from the ground up as a new product."
version.workspace    = true
edition.workspace    = true
license.workspace    = true

[[bin]]
name = "basilisk"
path = "src/main.rs"

# The `basilisk` binary is inert ([WITHDRAWAL-INERT]): it prints the approved
# notice and exits 4. It depends on no Basilisk crate — not the parser, the
# resolver, the checker, or the LSP — because it runs none of them, and a
# dependency edge to code that produced incorrect results is exactly what must
# not ship. `--version` is the sole surface left, so Shipwright is the sole
# dependency.
[dependencies]
shipwright          = "0.10.0"
shipwright-manifest = "0.10.0"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
basilisk-buildinfo.workspace = true

[lints]
workspace = true

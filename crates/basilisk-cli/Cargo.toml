[package]
name        = "basilisk-cli"
description = "Command-line interface for Basilisk"
version.workspace    = true
edition.workspace    = true
license.workspace    = true

[[bin]]
name = "basilisk"
path = "src/main.rs"

[dependencies]
basilisk-config.workspace   = true
basilisk-parser.workspace   = true
basilisk-resolver.workspace = true
basilisk-checker.workspace  = true
basilisk-lsp.workspace      = true
clap.workspace              = true
walkdir.workspace           = true
serde.workspace             = true
serde_json.workspace        = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing.workspace            = true
tracing-subscriber.workspace = true

[dev-dependencies]
basilisk-test-utils = { workspace = true, features = ["checker"] }
basilisk-stubs.workspace  = true

[lints]
workspace = true

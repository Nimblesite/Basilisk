[package]
name        = "basilisk-cli"
description = "Basilisk CLI — the only Python type checker scoring 100% on the official python/typing conformance suite (https://github.com/python/typing/blob/main/conformance/results/results.html) — and the fastest we've measured. Complete open-source Python dev environment in Rust: type checker, language server, debugger, profiler, plus VS Code, Cursor, Zed & Neovim extensions. Strict by default."
version.workspace    = true
edition.workspace    = true
license.workspace    = true

[[bin]]
name = "basilisk"
path = "src/main.rs"

[dependencies]
basilisk-config.workspace   = true
basilisk-parser.workspace   = true
basilisk-resolver.workspace = true
basilisk-checker.workspace  = true
basilisk-lsp.workspace      = true
basilisk-common.workspace   = true
basilisk-db.workspace       = true
basilisk-uv.workspace       = true
basilisk-stubs.workspace    = true
clap.workspace              = true
# Shipwright `--version` / `--version --json` contract emitter.
shipwright                  = "0.10.0"
shipwright-manifest         = "0.10.0"
colored.workspace           = true
tower-lsp                   = "0.20"
walkdir.workspace           = true
serde.workspace             = true
serde_json.workspace        = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing.workspace            = true
tracing-subscriber.workspace = true

[dev-dependencies]
basilisk-test-utils = { workspace = true, features = ["checker"] }
basilisk-stubs.workspace = true
tempfile = "3"

[build-dependencies]
basilisk-buildinfo.workspace = true

[lints]
workspace = true

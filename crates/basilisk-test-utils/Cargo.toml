[package]
name        = "basilisk-test-utils"
description = "Shared test helpers for Basilisk integration and E2E tests"
version.workspace    = true
edition.workspace    = true
license.workspace    = true

[dependencies]
serde_json = "1"

# Optional deps — only needed for crates that use the checker/parser/resolver
basilisk-checker  = { workspace = true, optional = true }
basilisk-parser   = { workspace = true, optional = true }
basilisk-resolver = { workspace = true, optional = true }

[features]
default = []
# Enable resolver-based helpers (resolve_src)
resolver = ["dep:basilisk-parser", "dep:basilisk-resolver"]
# Enable checker-based helpers (Expected, assert_diagnostics) — implies resolver
checker = ["resolver", "dep:basilisk-checker"]

[lints]
workspace = true

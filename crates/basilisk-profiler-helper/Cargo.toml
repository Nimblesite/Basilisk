[package]
name = "basilisk-profiler-helper"
version.workspace = true
edition.workspace = true
description = "Elevated helper binary for py-spy memory reading on macOS"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "basilisk-profiler-helper"
path = "src/main.rs"

[dependencies]
basilisk-common.workspace = true
basilisk-profiler-protocol.workspace = true
# Shipwright `--version` / `--version --json` contract emitter.
shipwright          = "0.10.0"
shipwright-manifest = "0.10.0"
py-spy = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt", "macros", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[build-dependencies]
basilisk-buildinfo.workspace = true

[lints]
workspace = true

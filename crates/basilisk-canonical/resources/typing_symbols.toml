# Implements [RESOLV-CANONICAL-REGISTRY].
# See docs/specs/CHECKER-ARCHITECTURE-SPEC.md#RESOLV-CANONICAL-REGISTRY
#
# THE SPECIFICATION REGISTRY — canonical definition sites of typing-spec symbols.
#
# WHAT THIS IS, AND WHY IT IS NOT THE BANNED MECHANISM.
#
# The banned mechanism compared the CHARACTERS AT A USE SITE against a Python
# spelling: `name.id == "ClassVar"`. That is wrong under aliasing
# (`from typing import ClassVar as CV`), wrong under module access
# (`import typing as t; t.ClassVar`), and wrong under shadowing
# (a local `class ClassVar:` is not the special form). It made the conformance
# score a measurement of how well the code had been fitted to the fixtures.
#
# This file is a different kind of statement. It records WHERE THE
# SPECIFICATION DEFINES EACH SYMBOL — a (module, name) definition site — and is
# consulted ONLY AFTER a use-site expression has been resolved, through the
# module's own import statements and local bindings, to the definition it
# actually binds to. The three cases above all resolve correctly because the
# resolution happens in the AST, not in the characters.
#
# This layer is unavoidable, and empirically so: in typeshed, `ClassVar`,
# `Final`, `Union`, `Literal`, `Protocol`, `Self`, `Never`, `Required`,
# `TypeGuard` and the rest are ALL declared identically as `X: _SpecialForm`.
# The declaration's structure carries NO information distinguishing them. What
# separates them is the typing specification, which assigns meaning to a
# canonical name at a canonical location. That assignment has to be written
# down once, as data, or no checker can implement the spec at all.
#
# RULES FOR THIS FILE:
#   * It is DATA, not logic. No Rust file may contain these spellings.
#   * Nothing here may be compared against use-site text. The only lawful
#     consumer is the canonical-symbol lookup in `canonical::binding`.
#   * Every entry must name a declaration that REALLY EXISTS in bundled
#     typeshed. `tests/canonical_registry.rs` fails the build otherwise, so an
#     invented symbol cannot be smuggled in to satisfy a fixture.
#   * `modules` lists every module that legitimately re-exports the symbol as
#     part of its public API, so `typing_extensions` back-ports resolve too.


# cargo-mutants configuration
# https://mutants.rs/configuration.html

# Multiply the baseline test duration by this factor for each mutant's timeout.
# 2x gives ample headroom without letting slow mutants stall the run.
timeout_multiplier = 2.0

# Require at least this many tests to run — catches misconfigured test suites
# that would otherwise silently pass every mutant.
minimum_test_count = 50

# Only test the packages being mutated, not the entire workspace.
# Prevents Phase 2–5 placeholder test failures in basilisk-lsp,
# basilisk-mojo, basilisk-plugin, and basilisk-stubs from blocking
# per-mutant test runs.
test_workspace = false

# Also restrict test runs to only these packages (same list as `packages`),
# so the baseline and per-mutant tests don't pick up placeholder crates.
test_package = [
    "basilisk-parser",
    "basilisk-resolver",
    "basilisk-checker",
    "basilisk-cli",
]

# Only mutate crates that have complete, passing test suites.
# Remove entries from this list (or add new ones) as coverage evolves.
# basilisk-db, basilisk-stubs, basilisk-plugin, basilisk-lsp, basilisk-mojo
# are excluded because they have no tests or have intentionally-failing tests
# (Phase 2 placeholders).
packages = [
    "basilisk-parser",
    "basilisk-resolver",
    "basilisk-checker",
    "basilisk-cli",
]

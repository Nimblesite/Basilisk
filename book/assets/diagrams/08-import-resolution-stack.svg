<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">One import, two searches</title>
  <desc id="desc">The Python runtime loads executable vendor source while Basilisk follows six ordered static resolution positions to select a type contract.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#6ec5e9"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#e8500a"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#0a0c12"/>
  <rect x="34" y="34" width="1532" height="932" rx="30" fill="#10141d" stroke="#252d3f" stroke-width="3"/>
  <text x="82" y="110" fill="#e8500a" font-family="monospace" font-size="28" font-weight="700" letter-spacing="5">IMPORTS HAVE TWO JOBS</text>
  <text x="82" y="178" fill="#f0f2f7" font-family="system-ui,sans-serif" font-size="60" font-weight="800">Execution and static evidence stay separate</text>
  <text x="84" y="226" fill="#8892a4" font-family="system-ui,sans-serif" font-size="29">The same import name enters two systems that answer different questions.</text>

  <g transform="translate(68 286)">
    <rect width="500" height="574" rx="28" fill="#17232c" stroke="#6ec5e9" stroke-width="4"/>
    <text x="42" y="62" fill="#7dd3fc" font-family="monospace" font-size="26" font-weight="700">PYTHON RUNTIME</text>
    <text x="42" y="108" fill="#f0f2f7" font-family="system-ui,sans-serif" font-size="34" font-weight="750">What code executes?</text>
    <rect x="42" y="154" width="416" height="76" rx="17" fill="#0e1820" stroke="#365164" stroke-width="3"/>
    <text x="250" y="202" text-anchor="middle" fill="#e0f2fe" font-family="monospace" font-size="27">import vendor_sensor</text>
    <line x1="250" y1="240" x2="250" y2="306" stroke="#6ec5e9" stroke-width="5" marker-end="url(#arrow-blue)"/>
    <rect x="42" y="324" width="416" height="116" rx="20" fill="#123128" stroke="#34d399" stroke-width="4"/>
    <text x="250" y="374" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="26" font-weight="700">vendor/vendor_sensor.py</text>
    <text x="250" y="412" text-anchor="middle" fill="#d1fae5" font-family="system-ui,sans-serif" font-size="25">load and execute</text>
    <text x="42" y="506" fill="#8892a4" font-family="system-ui,sans-serif" font-size="25">Evidence:</text>
    <text x="156" y="506" fill="#f0f2f7" font-family="system-ui,sans-serif" font-size="25">runtime tests and observations</text>
  </g>

  <g transform="translate(604 286)">
    <rect width="928" height="574" rx="28" fill="#261b13" stroke="#e8500a" stroke-width="4"/>
    <text x="42" y="62" fill="#fb923c" font-family="monospace" font-size="26" font-weight="700">BASILISK 0.39.0</text>
    <text x="42" y="108" fill="#f0f2f7" font-family="system-ui,sans-serif" font-size="34" font-weight="750">What contract describes it?</text>
    <g font-family="system-ui,sans-serif" font-size="23">
      <rect x="42" y="146" width="844" height="56" rx="14" fill="#5a2c14" stroke="#fb923c" stroke-width="3"/>
      <text x="70" y="182" fill="#fff7ed"><tspan font-weight="800">1</tspan><tspan dx="24">manual paths: reviewed, generated, extra</tspan></text>
      <rect x="62" y="214" width="804" height="52" rx="13" fill="#171c25" stroke="#4a5468" stroke-width="2"/>
      <text x="88" y="248" fill="#e5e7eb"><tspan font-weight="800">2</tspan><tspan dx="24">user code being checked</tspan></text>
      <rect x="82" y="278" width="764" height="52" rx="13" fill="#171c25" stroke="#4a5468" stroke-width="2"/>
      <text x="108" y="312" fill="#e5e7eb"><tspan font-weight="800">3</tspan><tspan dx="24">selected standard-library typeshed</tspan></text>
      <rect x="102" y="342" width="724" height="52" rx="13" fill="#171c25" stroke="#4a5468" stroke-width="2"/>
      <text x="128" y="376" fill="#e5e7eb"><tspan font-weight="800">4</tspan><tspan dx="24">installed stub-only packages</tspan></text>
      <rect x="122" y="406" width="684" height="52" rx="13" fill="#171c25" stroke="#4a5468" stroke-width="2"/>
      <text x="148" y="440" fill="#e5e7eb"><tspan font-weight="800">5</tspan><tspan dx="24">installed packages with py.typed</tspan></text>
      <rect x="142" y="470" width="644" height="52" rx="13" fill="#171c25" stroke="#4a5468" stroke-width="2"/>
      <text x="168" y="504" fill="#e5e7eb"><tspan font-weight="800">6</tspan><tspan dx="24">vendored third-party stubs (none)</tspan></text>
    </g>
    <line x1="850" y1="164" x2="850" y2="500" stroke="#e8500a" stroke-width="5" marker-end="url(#arrow-orange)"/>
    <text x="42" y="558" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="25" font-weight="700">First applicable match wins.</text>
  </g>

  <rect x="202" y="894" width="1196" height="48" rx="18" fill="#0f1218" stroke="#4a5468" stroke-width="3"/>
  <text x="800" y="927" text-anchor="middle" fill="#f0f2f7" font-family="system-ui,sans-serif" font-size="25"><tspan fill="#e8500a" font-weight="800">Keep both:</tspan> executable evidence for runtime behavior; provenance for the static contract.</text>
</svg>

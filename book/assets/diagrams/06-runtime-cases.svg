<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Write and test every runtime case</title><desc id="desc">Ready, offline, and fault statuses each route to one explicit tested outcome without relying on a portable match-inference claim.</desc>
  <rect width="1600" height="1000" fill="#0a0c12"/><rect x="34" y="34" width="1532" height="932" rx="30" fill="#10141d" stroke="#252d3f" stroke-width="3"/>
  <text x="82" y="112" fill="#e8500a" font-family="monospace" font-size="28" font-weight="700" letter-spacing="5">RUNTIME CASES</text><text x="82" y="180" fill="#f0f2f7" font-family="system-ui,sans-serif" font-size="58" font-weight="800">Visible branches, observable outcomes</text>
  <rect x="100" y="280" width="360" height="150" rx="24" fill="#141820" stroke="#6ec5e9" stroke-width="4"/><text x="280" y="370" text-anchor="middle" fill="#f0f2f7" font-family="monospace" font-size="36">"ready"</text><path d="M460 355H690" stroke="#6ec5e9" stroke-width="6"/><rect x="690" y="280" width="810" height="150" rx="24" fill="#123128" stroke="#34d399" stroke-width="4"/><text x="1095" y="370" text-anchor="middle" fill="#a7f3d0" font-family="system-ui,sans-serif" font-size="34">accept readings</text>
  <rect x="100" y="500" width="360" height="150" rx="24" fill="#141820" stroke="#6ec5e9" stroke-width="4"/><text x="280" y="590" text-anchor="middle" fill="#f0f2f7" font-family="monospace" font-size="36">"offline"</text><path d="M460 575H690" stroke="#6ec5e9" stroke-width="6"/><rect x="690" y="500" width="810" height="150" rx="24" fill="#191d27" stroke="#8892a4" stroke-width="4"/><text x="1095" y="590" text-anchor="middle" fill="#f0f2f7" font-family="system-ui,sans-serif" font-size="34">wait for sensor</text>
  <rect x="100" y="720" width="360" height="150" rx="24" fill="#141820" stroke="#6ec5e9" stroke-width="4"/><text x="280" y="810" text-anchor="middle" fill="#f0f2f7" font-family="monospace" font-size="36">"fault"</text><path d="M460 795H690" stroke="#6ec5e9" stroke-width="6"/><rect x="690" y="720" width="810" height="150" rx="24" fill="#351b20" stroke="#f87171" stroke-width="4"/><text x="1095" y="810" text-anchor="middle" fill="#fecaca" font-family="system-ui,sans-serif" font-size="34">request inspection</text>
  <text x="800" y="930" text-anchor="middle" fill="#8892a4" font-family="system-ui,sans-serif" font-size="27">Runtime completeness is tested independently of checker-specific match inference.</text>
</svg>

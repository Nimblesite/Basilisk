<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Arguments enter and return values leave a typed function contract</title>
  <desc id="description">An integer argument flows into the float parameter of format temperature, the function body formats it, and a string result flows through the declared string return boundary to the caller.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#252d3f"/>
    </pattern>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1 1L12 7L1 13" fill="none" stroke="#6ec5e9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1 1L12 7L1 13" fill="none" stroke="#e8500a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#0a0c12"/>
  <rect x="34" y="34" width="1532" height="932" rx="30" fill="url(#dots)" stroke="#252d3f" stroke-width="3"/>

  <text x="82" y="110" fill="#e8500a" font-family="'JetBrains Mono',monospace" font-size="28" font-weight="700" letter-spacing="5">ARGUMENT IN · RESULT OUT</text>
  <text x="82" y="178" fill="#f0f2f7" font-family="'Space Grotesk',system-ui,sans-serif" font-size="60" font-weight="800">A signature has two directions</text>
  <text x="84" y="226" fill="#8892a4" font-family="'Space Grotesk',system-ui,sans-serif" font-size="29">Each arrow has its own source value and typed destination.</text>

  <g transform="translate(72 328)">
    <text x="160" y="0" text-anchor="middle" fill="#6ec5e9" font-family="'JetBrains Mono',monospace" font-size="28" font-weight="700" letter-spacing="4">CALLER</text>
    <rect x="0" y="38" width="320" height="210" rx="26" fill="#141820" stroke="#6ec5e9" stroke-width="4"/>
    <text x="160" y="103" text-anchor="middle" fill="#f0f2f7" font-family="'JetBrains Mono',monospace" font-size="34">21</text>
    <text x="160" y="150" text-anchor="middle" fill="#bae6fd" font-family="'JetBrains Mono',monospace" font-size="28">argument: int</text>
    <text x="160" y="202" text-anchor="middle" fill="#8892a4" font-family="'Space Grotesk',system-ui,sans-serif" font-size="28">source value</text>
  </g>

  <path d="M410 472H544" fill="none" stroke="#6ec5e9" stroke-width="6" marker-end="url(#arrow-blue)"/>
  <rect x="438" y="393" width="104" height="48" rx="24" fill="#123128" stroke="#34d399" stroke-width="3"/>
  <text x="490" y="425" text-anchor="middle" fill="#a7f3d0" font-family="'Space Grotesk',system-ui,sans-serif" font-size="28" font-weight="800">PASS</text>
  <text x="476" y="526" text-anchor="middle" fill="#8892a4" font-family="'Space Grotesk',system-ui,sans-serif" font-size="28">int → float</text>

  <g transform="translate(572 290)">
    <rect width="540" height="440" rx="30" fill="#141820" stroke="#e8500a" stroke-width="5"/>
    <text x="270" y="58" text-anchor="middle" fill="#e8500a" font-family="'JetBrains Mono',monospace" font-size="28" font-weight="700" letter-spacing="4">FUNCTION CONTRACT</text>
    <text x="270" y="112" text-anchor="middle" fill="#f0f2f7" font-family="'JetBrains Mono',monospace" font-size="29">format_temperature</text>

    <rect x="40" y="154" width="460" height="84" rx="18" fill="#0f1218" stroke="#6ec5e9" stroke-width="3"/>
    <text x="270" y="207" text-anchor="middle" fill="#bae6fd" font-family="'JetBrains Mono',monospace" font-size="29">celsius: float</text>
    <text x="270" y="278" text-anchor="middle" fill="#8892a4" font-family="'Space Grotesk',system-ui,sans-serif" font-size="28">body formats the received value</text>
    <rect x="40" y="312" width="460" height="84" rx="18" fill="#0f1218" stroke="#e8500a" stroke-width="3"/>
    <text x="270" y="365" text-anchor="middle" fill="#fed7aa" font-family="'JetBrains Mono',monospace" font-size="29">return value → str</text>
  </g>

  <path d="M1136 646H1266" fill="none" stroke="#e8500a" stroke-width="6" marker-end="url(#arrow-orange)"/>
  <rect x="1164" y="566" width="104" height="48" rx="24" fill="#123128" stroke="#34d399" stroke-width="3"/>
  <text x="1216" y="598" text-anchor="middle" fill="#a7f3d0" font-family="'Space Grotesk',system-ui,sans-serif" font-size="28" font-weight="800">PASS</text>
  <text x="1202" y="704" text-anchor="middle" fill="#8892a4" font-family="'Space Grotesk',system-ui,sans-serif" font-size="28">str → str</text>

  <g transform="translate(1292 502)">
    <text x="118" y="0" text-anchor="middle" fill="#e8500a" font-family="'JetBrains Mono',monospace" font-size="28" font-weight="700" letter-spacing="4">CALLER</text>
    <rect x="0" y="38" width="236" height="210" rx="26" fill="#141820" stroke="#e8500a" stroke-width="4"/>
    <text x="118" y="103" text-anchor="middle" fill="#f0f2f7" font-family="'JetBrains Mono',monospace" font-size="31">"21.0 °C"</text>
    <text x="118" y="150" text-anchor="middle" fill="#fed7aa" font-family="'JetBrains Mono',monospace" font-size="28">result: str</text>
    <text x="118" y="202" text-anchor="middle" fill="#8892a4" font-family="'Space Grotesk',system-ui,sans-serif" font-size="28">usable value</text>
  </g>

  <g transform="translate(118 810)">
    <rect width="1364" height="112" rx="24" fill="#0f1218" stroke="#4a5468" stroke-width="3"/>
    <line x1="682" y1="18" x2="682" y2="94" stroke="#252d3f" stroke-width="3"/>
    <text x="34" y="45" fill="#bae6fd" font-family="'Space Grotesk',system-ui,sans-serif" font-size="28" font-weight="700">Parameter check</text>
    <text x="34" y="82" fill="#f0f2f7" font-family="'JetBrains Mono',monospace" font-size="28">argument → parameter</text>
    <text x="720" y="45" fill="#fed7aa" font-family="'Space Grotesk',system-ui,sans-serif" font-size="28" font-weight="700">Return check</text>
    <text x="720" y="82" fill="#f0f2f7" font-family="'JetBrains Mono',monospace" font-size="28">expression → return annotation</text>
  </g>
</svg>

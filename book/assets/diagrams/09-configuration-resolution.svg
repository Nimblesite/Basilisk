<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Choose, preview, review, and apply one root rule change</title>
  <desc id="desc">Four stages show a root BSK-0001 severity choice moving through a server preview and human review before a versioned edit updates the root pyproject file and triggers a recheck.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#e8500a"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#0a0c12"/>
  <rect x="34" y="34" width="1532" height="932" rx="30" fill="#10141d" stroke="#252d3f" stroke-width="3"/>
  <text x="82" y="110" fill="#e8500a" font-family="monospace" font-size="28" font-weight="700" letter-spacing="5">ONE ROOT POLICY CHANGE</text>
  <text x="82" y="178" fill="#f0f2f7" font-family="system-ui,sans-serif" font-size="60" font-weight="800">Choose → preview → review → apply</text>
  <text x="84" y="226" fill="#8892a4" font-family="system-ui,sans-serif" font-size="29">The configuration editor does not write while the reader is deciding.</text>

  <g transform="translate(68 306)">
    <g>
      <rect width="320" height="410" rx="26" fill="#17232c" stroke="#6ec5e9" stroke-width="4"/>
      <circle cx="50" cy="52" r="28" fill="#6ec5e9"/><text x="50" y="62" text-anchor="middle" fill="#0a0c12" font-family="monospace" font-size="27" font-weight="800">1</text>
      <text x="92" y="62" fill="#f0f2f7" font-family="system-ui,sans-serif" font-size="32" font-weight="750">CHOOSE</text>
      <text x="30" y="126" fill="#8892a4" font-family="system-ui,sans-serif" font-size="23">Root rule control</text>
      <rect x="30" y="160" width="260" height="72" rx="16" fill="#0e1820" stroke="#365164" stroke-width="3"/>
      <text x="160" y="205" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="25">BSK-0001</text>
      <text x="30" y="286" fill="#8892a4" font-family="system-ui,sans-serif" font-size="22">Candidate severity</text>
      <rect x="30" y="316" width="260" height="62" rx="31" fill="#35251c" stroke="#e8500a" stroke-width="3"/>
      <text x="160" y="356" text-anchor="middle" fill="#fed7aa" font-family="system-ui,sans-serif" font-size="25" font-weight="700">Warning</text>
    </g>
    <line x1="332" y1="205" x2="380" y2="205" stroke="#e8500a" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(396)">
      <rect width="320" height="410" rx="26" fill="#261b13" stroke="#e8500a" stroke-width="4"/>
      <circle cx="50" cy="52" r="28" fill="#e8500a"/><text x="50" y="62" text-anchor="middle" fill="#0a0c12" font-family="monospace" font-size="27" font-weight="800">2</text>
      <text x="92" y="62" fill="#f0f2f7" font-family="system-ui,sans-serif" font-size="32" font-weight="750">PREVIEW</text>
      <text x="30" y="126" fill="#8892a4" font-family="system-ui,sans-serif" font-size="23">Server computes</text>
      <rect x="30" y="160" width="260" height="55" rx="13" fill="#17120e"/><text x="50" y="196" fill="#f0f2f7" font-family="system-ui,sans-serif" font-size="22">active revision</text>
      <rect x="30" y="231" width="260" height="55" rx="13" fill="#17120e"/><text x="50" y="267" fill="#f0f2f7" font-family="system-ui,sans-serif" font-size="22">resolved severities</text>
      <rect x="30" y="302" width="260" height="55" rx="13" fill="#17120e"/><text x="50" y="338" fill="#f0f2f7" font-family="system-ui,sans-serif" font-size="22">diagnostic impact</text>
    </g>
    <line x1="728" y1="205" x2="776" y2="205" stroke="#e8500a" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(792)">
      <rect width="320" height="410" rx="26" fill="#201a2c" stroke="#c4b5fd" stroke-width="4"/>
      <circle cx="50" cy="52" r="28" fill="#c4b5fd"/><text x="50" y="62" text-anchor="middle" fill="#0a0c12" font-family="monospace" font-size="27" font-weight="800">3</text>
      <text x="92" y="62" fill="#f0f2f7" font-family="system-ui,sans-serif" font-size="32" font-weight="750">REVIEW</text>
      <text x="30" y="126" fill="#8892a4" font-family="system-ui,sans-serif" font-size="23">Nothing written yet</text>
      <rect x="30" y="160" width="260" height="112" rx="17" fill="#14101c" stroke="#4b3e63" stroke-width="3"/>
      <text x="50" y="202" fill="#ddd6fe" font-family="monospace" font-size="22">BSK-0001</text>
      <text x="50" y="244" fill="#f0f2f7" font-family="monospace" font-size="22">error → warning</text>
      <rect x="30" y="310" width="112" height="58" rx="14" fill="#0f1218" stroke="#6ec5e9" stroke-width="2"/><text x="86" y="347" text-anchor="middle" fill="#bae6fd" font-family="system-ui,sans-serif" font-size="22">Cancel</text>
      <rect x="154" y="310" width="136" height="58" rx="14" fill="#e8500a"/><text x="222" y="347" text-anchor="middle" fill="#0a0c12" font-family="system-ui,sans-serif" font-size="18" font-weight="750">Apply change</text>
    </g>
    <line x1="1124" y1="205" x2="1172" y2="205" stroke="#e8500a" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(1188)">
      <rect width="320" height="410" rx="26" fill="#123128" stroke="#34d399" stroke-width="4"/>
      <circle cx="50" cy="52" r="28" fill="#34d399"/><text x="50" y="62" text-anchor="middle" fill="#0a0c12" font-family="monospace" font-size="27" font-weight="800">4</text>
      <text x="92" y="62" fill="#f0f2f7" font-family="system-ui,sans-serif" font-size="32" font-weight="750">APPLY</text>
      <text x="30" y="126" fill="#8892a4" font-family="system-ui,sans-serif" font-size="23">One versioned edit</text>
      <rect x="30" y="160" width="260" height="102" rx="17" fill="#0e1c18" stroke="#2f5b4d" stroke-width="3"/>
      <text x="50" y="202" fill="#a7f3d0" font-family="monospace" font-size="20">root/pyproject.toml</text>
      <text x="50" y="238" fill="#f0f2f7" font-family="system-ui,sans-serif" font-size="22">client applies edit</text>
      <rect x="30" y="310" width="260" height="62" rx="31" fill="#0e1c18" stroke="#34d399" stroke-width="3"/>
      <text x="160" y="350" text-anchor="middle" fill="#a7f3d0" font-family="system-ui,sans-serif" font-size="24" font-weight="700">reload + recheck</text>
    </g>
  </g>

  <rect x="202" y="802" width="1196" height="110" rx="22" fill="#0f1218" stroke="#4a5468" stroke-width="3"/>
  <text x="800" y="850" text-anchor="middle" fill="#f0f2f7" font-family="system-ui,sans-serif" font-size="28"><tspan fill="#e8500a" font-weight="800">Revision safety:</tspan> if the source changes, the preview is stale.</text>
  <text x="800" y="888" text-anchor="middle" fill="#8892a4" font-family="system-ui,sans-serif" font-size="25">Refresh the facts and make the decision again.</text>
</svg>

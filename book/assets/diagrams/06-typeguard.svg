<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">A TypeGuard gives a checker-readable positive test</title><desc id="desc">An object passes through runtime validation. True establishes ReadingEvent on the positive path, while False preserves the original object type.</desc>
  <rect width="1600" height="1000" fill="#0a0c12"/><rect x="34" y="34" width="1532" height="932" rx="30" fill="#10141d" stroke="#252d3f" stroke-width="3"/>
  <text x="82" y="112" fill="#e8500a" font-family="monospace" font-size="28" font-weight="700" letter-spacing="5">TYPEGUARD</text><text x="82" y="180" fill="#f0f2f7" font-family="system-ui,sans-serif" font-size="58" font-weight="800">One predicate, one specified direction</text>
  <rect x="90" y="375" width="330" height="170" rx="24" fill="#141820" stroke="#6ec5e9" stroke-width="4"/><text x="255" y="450" text-anchor="middle" fill="#f0f2f7" font-family="monospace" font-size="38">value</text><text x="255" y="500" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="28">object</text>
  <path d="M420 460H590" stroke="#6ec5e9" stroke-width="6"/><rect x="590" y="320" width="420" height="280" rx="28" fill="#191d27" stroke="#e8500a" stroke-width="5"/><text x="800" y="410" text-anchor="middle" fill="#f0f2f7" font-family="monospace" font-size="29">is_reading_event</text><text x="800" y="462" text-anchor="middle" fill="#8892a4" font-family="system-ui,sans-serif" font-size="26">checks keys and values</text><text x="800" y="535" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="27">→ TypeGuard[ReadingEvent]</text>
  <path d="M1010 400H1150" stroke="#34d399" stroke-width="6"/><text x="1080" y="382" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="25">True</text><rect x="1150" y="300" width="360" height="190" rx="24" fill="#123128" stroke="#34d399" stroke-width="5"/><text x="1330" y="385" text-anchor="middle" fill="#f0f2f7" font-family="monospace" font-size="31">ReadingEvent</text><text x="1330" y="435" text-anchor="middle" fill="#a7f3d0" font-family="system-ui,sans-serif" font-size="25">specified narrowing</text>
  <path d="M1010 520H1150" stroke="#8892a4" stroke-width="6"/><text x="1080" y="570" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="25">False</text><rect x="1150" y="540" width="360" height="190" rx="24" fill="#191d27" stroke="#8892a4" stroke-width="4"/><text x="1330" y="625" text-anchor="middle" fill="#f0f2f7" font-family="monospace" font-size="31">object</text><text x="1330" y="675" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="25">original type remains</text>
  <text x="800" y="860" text-anchor="middle" fill="#8892a4" font-family="system-ui,sans-serif" font-size="28">The annotation trusts the predicate; runtime tests must justify that trust.</text>
</svg>

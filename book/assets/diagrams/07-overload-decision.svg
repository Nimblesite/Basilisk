<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Overloads connect inputs to precise outputs</title>
  <desc id="desc">A two-row decision table maps one RawReading to one Reading and a list of RawReading to a list of Reading, then both rows converge on a single union-typed runtime implementation.</desc>
  <defs>
    <marker id="orange-arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M1 1L12 7L1 13" fill="none" stroke="#e8500a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="gray-arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M1 1L12 7L1 13" fill="none" stroke="#8892a4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#0a0c12"/>
  <rect x="34" y="34" width="1532" height="932" rx="30" fill="#10141d" stroke="#252d3f" stroke-width="3"/>
  <text x="82" y="110" fill="#e8500a" font-family="monospace" font-size="28" font-weight="700" letter-spacing="5">OVERLOAD DECISION TABLE</text>
  <text x="82" y="178" fill="#f0f2f7" font-family="system-ui,sans-serif" font-size="60" font-weight="800">Precise calls, one implementation</text>
  <text x="84" y="226" fill="#8892a4" font-family="system-ui,sans-serif" font-size="29">Each public call form keeps its input-to-output promise.</text>

  <text x="240" y="302" text-anchor="middle" fill="#7dd3fc" font-family="system-ui,sans-serif" font-size="25" font-weight="800">CALLER PROVIDES</text>
  <text x="800" y="302" text-anchor="middle" fill="#fcd34d" font-family="system-ui,sans-serif" font-size="25" font-weight="800">STATIC DECLARATION</text>
  <text x="1360" y="302" text-anchor="middle" fill="#86efac" font-family="system-ui,sans-serif" font-size="25" font-weight="800">CALLER RECEIVES</text>

  <g transform="translate(74 338)">
    <rect width="332" height="138" rx="24" fill="#17232c" stroke="#6ec5e9" stroke-width="4"/>
    <text x="166" y="58" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="28">RawReading</text>
    <text x="166" y="100" text-anchor="middle" fill="#8892a4" font-family="system-ui,sans-serif" font-size="23">one validated value</text>
  </g>
  <path d="M424 407H538" fill="none" stroke="#e8500a" stroke-width="6" marker-end="url(#orange-arrow)"/>
  <g transform="translate(558 338)">
    <rect width="484" height="138" rx="24" fill="#2a2015" stroke="#fbbf24" stroke-width="4"/>
    <text x="242" y="58" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="27">ingest(RawReading)</text>
    <text x="242" y="101" text-anchor="middle" fill="#f0f2f7" font-family="monospace" font-size="25">-&gt; Reading</text>
  </g>
  <path d="M1062 407H1176" fill="none" stroke="#e8500a" stroke-width="6" marker-end="url(#orange-arrow)"/>
  <g transform="translate(1196 338)">
    <rect width="332" height="138" rx="24" fill="#123128" stroke="#34d399" stroke-width="4"/>
    <text x="166" y="58" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="30">Reading</text>
    <text x="166" y="100" text-anchor="middle" fill="#86efac" font-family="system-ui,sans-serif" font-size="23">precise result</text>
  </g>

  <g transform="translate(74 526)">
    <rect width="332" height="138" rx="24" fill="#17232c" stroke="#6ec5e9" stroke-width="4"/>
    <text x="166" y="58" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="25">list[RawReading]</text>
    <text x="166" y="100" text-anchor="middle" fill="#8892a4" font-family="system-ui,sans-serif" font-size="23">validated batch</text>
  </g>
  <path d="M424 595H538" fill="none" stroke="#e8500a" stroke-width="6" marker-end="url(#orange-arrow)"/>
  <g transform="translate(558 526)">
    <rect width="484" height="138" rx="24" fill="#2a2015" stroke="#fbbf24" stroke-width="4"/>
    <text x="242" y="58" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="25">ingest(list[RawReading])</text>
    <text x="242" y="101" text-anchor="middle" fill="#f0f2f7" font-family="monospace" font-size="25">-&gt; list[Reading]</text>
  </g>
  <path d="M1062 595H1176" fill="none" stroke="#e8500a" stroke-width="6" marker-end="url(#orange-arrow)"/>
  <g transform="translate(1196 526)">
    <rect width="332" height="138" rx="24" fill="#123128" stroke="#34d399" stroke-width="4"/>
    <text x="166" y="58" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="27">list[Reading]</text>
    <text x="166" y="100" text-anchor="middle" fill="#86efac" font-family="system-ui,sans-serif" font-size="23">precise result</text>
  </g>

  <path d="M800 680V730" fill="none" stroke="#8892a4" stroke-width="5" marker-end="url(#gray-arrow)"/>
  <g transform="translate(214 750)">
    <rect width="1172" height="152" rx="28" fill="#171a22" stroke="#8892a4" stroke-width="4"/>
    <text x="586" y="48" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="25" font-weight="800">ONE RUNTIME BODY</text>
    <text x="586" y="95" text-anchor="middle" fill="#f0f2f7" font-family="monospace" font-size="25">RawReading | list[RawReading]</text>
    <text x="586" y="130" text-anchor="middle" fill="#f0f2f7" font-family="monospace" font-size="25">-&gt; Reading | list[Reading]</text>
  </g>
  <text x="800" y="944" text-anchor="middle" fill="#8892a4" font-family="system-ui,sans-serif" font-size="26">Overload declarations describe calls; the union body performs the work.</text>
</svg>

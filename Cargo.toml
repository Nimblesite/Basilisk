[workspace]
resolver = "2"
members = [
    "crates/basilisk-db",
    "crates/basilisk-parser",
    "crates/basilisk-resolver",
    "crates/basilisk-checker",
    "crates/basilisk-cli",
    "crates/basilisk-stubs",
    "crates/basilisk-typeshed-fetch",
    "crates/basilisk-config",
    "crates/basilisk-lsp",
    "crates/basilisk-common",
    "crates/basilisk-buildinfo",
    "crates/basilisk-test-macros",
    "crates/basilisk-test-utils",
    "crates/basilisk-uv",
    "crates/basilisk-profiler-helper",
    "crates/basilisk-profiler-protocol",
    "crates/basilisk-wasm",
    "basilisk-zed",
]
exclude = []

[workspace.package]
version      = "0.0.0-PLACEHOLDER"
edition      = "2021"
license      = "MIT"
repository   = "https://github.com/Nimblesite/Basilisk"
# Floor set by the Ruff family pinned below: ruff 0.16.1's workspace declares
# `rust-version = "1.95"`, so anything older cannot build this tree. Keep the
# two in lockstep — a bump to the ruff rev may raise this again.
rust-version = "1.95"

[workspace.dependencies]
# Ruff AST — not published as standalone crates; pinned to an immutable commit
# rev (not a tag, which upstream can move or delete) so the version can never be
# swapped out from under us. rev 80790b3 == tag 0.16.1.
# The whole ruff family MUST move together (shared ruff_text_size/AST types);
# bump all three revs in lockstep or the tree ends up with two incompatible
# copies of ruff_text_size. 0.16.1 is edition-2024 and needs rustc >= 1.95,
# which the current stable toolchain (CI `dtolnay/rust-toolchain@stable`)
# provides; `rust-version` above records that floor.
# The pip-installed `ruff` binary (CI + Dockerfile) MUST match: ruff==0.16.1.
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", rev = "80790b348b5188e7fc253665540f442c6ec7dd05" }
ruff_python_ast    = { git = "https://github.com/astral-sh/ruff", rev = "80790b348b5188e7fc253665540f442c6ec7dd05" }
ruff_text_size     = { git = "https://github.com/astral-sh/ruff", rev = "80790b348b5188e7fc253665540f442c6ec7dd05" }
# In-process formatter engine + stdlib-module table for import sorting
# ([LSPFMT-ENGINE], [LSPFMT-IMPORTS]) — the external `ruff` CLI is never spawned.
ruff_python_formatter = { git = "https://github.com/astral-sh/ruff", rev = "80790b348b5188e7fc253665540f442c6ec7dd05" }
ruff_python_stdlib    = { git = "https://github.com/astral-sh/ruff", rev = "80790b348b5188e7fc253665540f442c6ec7dd05" }
ruff_formatter        = { git = "https://github.com/astral-sh/ruff", rev = "80790b348b5188e7fc253665540f442c6ec7dd05" }

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI and utilities
clap      = { version = "4.6", features = ["derive"] }
thiserror = "2.0"
walkdir   = "2.5"
serde     = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml      = "1.1"
toml_edit = "0.25.13"
colored   = "3.0"

# Incremental computation — Salsa powers the demand-driven query engine
# ([CHKARCH-INCREMENTAL-SALSA]); the same framework underpins rust-analyzer.
salsa     = "0.28"

# Workspace crates
basilisk-db       = { path = "crates/basilisk-db" }
basilisk-parser   = { path = "crates/basilisk-parser" }
basilisk-resolver = { path = "crates/basilisk-resolver" }
basilisk-checker  = { path = "crates/basilisk-checker" }
basilisk-lsp      = { path = "crates/basilisk-lsp" }
basilisk-stubs      = { path = "crates/basilisk-stubs" }
basilisk-typeshed-fetch = { path = "crates/basilisk-typeshed-fetch" }
basilisk-config     = { path = "crates/basilisk-config" }
basilisk-common     = { path = "crates/basilisk-common" }
basilisk-buildinfo  = { path = "crates/basilisk-buildinfo" }
basilisk-test-macros = { path = "crates/basilisk-test-macros" }
basilisk-uv         = { path = "crates/basilisk-uv" }
basilisk-test-utils = { path = "crates/basilisk-test-utils" }
basilisk-profiler-protocol = { path = "crates/basilisk-profiler-protocol" }

[workspace.lints.rust]
unsafe_code  = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unused_imports = "deny"
dead_code = "deny"
unused_variables = "deny"
unused_mut = "deny"
unused_assignments = "deny"
unused_results = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
elided_lifetimes_in_paths = "deny"
# Stale #[expect] attributes must be errors, not warnings — no dead suppressions
unfulfilled_lint_expectations = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(mutation_testing)"] }
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
# all + pedantic at maximum — restriction & nursery cherry-picked (contain contradictions)
all                  = { level = "deny", priority = -1 }
pedantic             = { level = "deny", priority = -1 }
unwrap_used          = "deny"
expect_used          = "deny"
panic                = "deny"
todo                 = "deny"
unimplemented        = "deny"
# Implicit panics from out-of-bounds indexing — use .get() instead
indexing_slicing     = "deny"
# Silent lossy type conversions via `as` — use .into()/.try_into() instead
as_conversions       = "deny"
# Forgotten debug macros leaking info to stderr
dbg_macro            = "deny"
# Resource leaks from skipped destructors — use ManuallyDrop if needed
mem_forget           = "deny"
# From impls that can panic should be TryFrom instead
fallible_impl_from   = "deny"
# Catch needless implicit clones — use .clone() for explicit intent
implicit_clone       = "deny"
# Require SAFETY comments on any unsafe block — defense in depth for allowed exceptions
undocumented_unsafe_blocks = "deny"
# Prevent silent precision loss in float literals — critical for numeric type correctness
lossy_float_literal  = "deny"
# Prevent stack overflow from oversized local variables — critical for recursive AST walking
large_stack_frames   = "deny"
# Force #[expect] over #[allow] so stale lint suppressions don't hide new violations
allow_attributes     = "deny"
too_many_lines       = "deny"
too_many_arguments   = "deny"
cast_possible_truncation = "deny"
# Catch accidental infinite loops — require `-> !` return type for intentional ones
infinite_loop        = "deny"
# Prevent silent error cause discarding in .map_err(|_| ...) — preserve error provenance
map_err_ignore       = "deny"
# Prevent process::exit() — use proper error propagation, exit only via main() return
exit                 = "deny"
# Catch struct destructures that silently ignore new fields — critical during refactoring
rest_pat_in_fully_bound_structs = "deny"
# Require Arc::clone(&x) syntax — make ref-counted pointer cloning visually distinct
clone_on_ref_ptr     = "deny"
# `unreachable!()` is a panic like any other — completes the panic-macro ban above
# (panic/todo/unimplemented). A case you believe cannot happen still has to be
# modelled in the type or returned as an error, never asserted at runtime.
unreachable          = "deny"
# Clones whose value is dropped or overwritten without being read. Pure waste on
# the checker's hot paths; indicative benchmarks make the cost visible without
# turning workstation noise into a pass/fail gate ([CHKARCH-TESTING-BENCH]).
redundant_clone      = "deny"
# `assert!(x.is_ok())` prints "assertion failed" and throws the error away.
# Unwrap the Result instead so a failing test names the actual cause.
assertions_on_result_states = "deny"
# Reading and writing the same binding inside one expression makes the result
# depend on Rust's evaluation order — split the statement instead.
mixed_read_write_in_expression = "deny"
# A `Peekable` that is never peeked means the lookahead logic was dropped
# somewhere — the iterator is silently behaving differently than intended.
unused_peekable      = "deny"
# Release artifacts are latency-sensitive CLI/LSP binaries. Fat LTO plus one
# codegen unit lets LLVM optimize across crate boundaries and keeps shipped
# latency low; development and CI test profiles remain fast below.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# ── CI profile: fast compilation for test/coverage runs ──────────────────────
# Use via `cargo test --profile ci` or `cargo llvm-cov --profile ci`.
# Trades peak runtime speed for much faster compilation and linking.
[profile.ci]
inherits = "dev"
opt-level = 1
codegen-units = 16
lto = false
# Line tables only, not full DWARF. Source-based coverage reads the
# `__llvm_covmap`/`__llvm_covfun` sections and the .profraw pool — never DWARF —
# so lcov.info and every threshold in coverage-thresholds.json are unaffected,
# while ~150 instrumented binaries get materially cheaper to link and to store
# (this job already has to reclaim ~25 GB of preinstalled toolchains to fit).
# `debug = 1` keeps file:line in panic backtraces, so failure diagnosis is
# unchanged; `debug-assertions` is a separate key, inherited from dev, untouched.
debug = 1
incremental = false

# ── E2E profile: a release-speed binary built for driving, not for shipping ───
# For CI jobs whose ONLY purpose is to run an editor E2E suite against a real
# binary — today the win32 leg of the VS Code suite ([VSIX-CI-PLATFORM-COVERAGE]).
# Those jobs hunt platform-specific defects (`.exe` suffixes, `\` separators,
# per-platform bundle layout, process spawn/teardown); none of that is affected
# by how LLVM optimizes, so paying for fat LTO there buys nothing.
#
# It costs a great deal. Fat LTO with one codegen unit is a SERIAL tail: measured
# on this workspace with a warm dependency cache — exactly the CI shape, since
# Swatinem caches deps and always rebuilds first-party crates — `release` takes
# 145.5s wall for 148.2s of CPU (1.02x parallelism: one core, however many the
# runner has), while this profile takes 27.1s wall for 101.0s of CPU (3.7x). The
# runner's other cores go to waste under `release`.
#
# opt-level 3 is retained deliberately: the E2E suites drive a real LSP under
# per-test timeouts, so the binary must stay fast at RUNTIME. Only the
# cross-crate optimization — which affects binary size and benchmark numbers,
# neither of which an E2E job measures — is given up.
#
# NOT for anything a user receives. Shipped artifacts (release.yml, and the
# `_release_vsix` recipe the Linux leg builds for [VSIX-PACKAGING-PARITY]) stay
# on `release`: dropping LTO grows the binary ~10% (16.3 -> 17.9 MB), and
# download size is user-visible. Benchmarks stay on `release` too so indicative
# measurements exercise the shipped profile ([CHKARCH-TESTING-BENCH]).
[profile.e2e]
inherits = "release"
lto = false
codegen-units = 16

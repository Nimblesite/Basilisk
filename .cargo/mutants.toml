# cargo-mutants configuration
# https://mutants.rs/configuration.html
# This file must live at .cargo/mutants.toml to be auto-detected.

# Do not rebuild/test packages outside the ones being mutated.
test_workspace = false

# Cap lints to allow so that deny-warnings don't make mutants unviable.
# When cargo-mutants replaces a function body (e.g. `-> Option<&str>` with `None`),
# the original parameters become unused and trigger --deny=unused_variables.
cap_lints = true

# Respect .gitignore when copying workspace (excludes node_modules, target, etc.)
# Without this, cargo-mutants copies 200MB+ of node_modules per mutant → disk full.
gitignore = true

# Only mutate basilisk-checker. All other crates are excluded:
#   basilisk-parser   — 2 mutants, 0 tests, all unviable
#   basilisk-resolver — cold builds take 300s+; tests don't cover mutations well
#   basilisk-lsp      — no unit tests; spawns language server subprocess
#   basilisk-cli      — e2e tests spawn compiled binary; hangs per-mutant
test_package = [
    "basilisk-checker",
]

# Equivalent mutants: these produce no observable behaviour change because
# surrounding code handles the edge case gracefully. Excluding them avoids
# false "missed" reports that can never be killed by a test. Patterns are
# matched against `cargo mutants --list` output, so they reference the rule's
# source path + the exact replacement. (Paths track the rule module names; keep
# them in sync when a rule file/dir is renamed, or the exclusions silently lapse.)
#
#   assignment_compatibility/mod.rs extract_annotation `pos + 1` → `pos * 1`:
#   line_start then points at the preceding '\n', but name_offset
#   (= start - line_start) shifts by the same amount, so every slice taken from
#   `line` is byte-identical to the unmutated extraction. Provably equivalent.
#
#   aliases_implicit.rs collect_type_alias_names `&& alias != "TypeAlias"` → `||`:
#   the only inputs that differ (`TypeAlias as TypeAlias`, or an empty alias) push
#   a duplicate "TypeAlias"/"" into `names`, which is consumed solely via
#   `is_type_alias_annotation`'s `.any(|n| ann == n)` — so the extra entry can
#   never change a diagnostic. Equivalent.
#
# (The former check_vars `&& rhs_span.is_some()` → `||` exclusion was dropped:
# that mutant is now killed by the `mutant_bare_declaration_not_flagged` test, so
# it stays in the pool as real, caught coverage rather than a hidden exclusion.)
exclude_re = [
    # Inference engine: slow, not covered by mutation-safe tests.
    "src/inference",
    # Equivalent mutants — produce no observable behaviour change:
    "assignment_compatibility/mod\\.rs:\\d+:\\d+: replace \\+ with \\* in extract_annotation",
    "aliases_implicit\\.rs:\\d+:\\d+: replace && with \\|\\| in collect_type_alias_names",
]
